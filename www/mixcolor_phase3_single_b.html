<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MIX COLOR! - Single B Survival Prototype</title>
<style>
  :root{
    --bg: #F7F7F7; --card-bg: #FFFFFF; --ink: #1E1E2E; --sub-ink: #8A8A9A;
    --magenta: #FF2E9A; --cyan: #00C2FF; --purple: #7C3AED; --yellow: #FFD400; --lime: #A6FF00;
    --danger: #FF4D4D;
    --radius-lg: 28px; --radius-md: 18px;
    --shadow: 0 6px 18px rgba(30,30,46,0.10);
    --shadow-strong: 0 10px 28px rgba(124,58,237,0.25);
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; height:100%; background: var(--bg); color: var(--ink);
    font-family: 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    -webkit-font-smoothing: antialiased; overscroll-behavior: none; overflow-x: hidden;
  }
  #app{ max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding: 18px 18px 34px; overflow-x: hidden; }
  .logo{ text-align:center; margin: 4px 0 14px; }
  .logo img{ height: 34px; display:inline-block; }
  .mode-tag{
    text-align:center; font-weight:900; font-size:12px; letter-spacing:3px; margin-bottom:14px;
    background: linear-gradient(90deg, var(--magenta), var(--purple) 55%, var(--cyan));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .panel{ background: var(--card-bg); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 16px; }

  /* start screen */
  .start-wrap{ text-align:center; padding: 10px 4px; }
  .survival-bg-screen{
    background-size: cover; background-position: center top; background-repeat: no-repeat;
    border-radius: var(--radius-lg); padding: 18px 10px 10px; min-height: calc(100vh - 52px);
    box-sizing: border-box;
  }
  .start-icon{ font-size:52px; margin-bottom:6px; }
  .start-desc{ font-size:13px; color:var(--sub-ink); font-weight:700; margin-bottom:18px; line-height:1.6; }
  .best-row{ display:flex; gap:10px; margin-bottom:20px; }
  .best-item{ flex:1; background:#F7F7F7; border-radius:16px; padding:14px 6px; }
  .best-num{ font-weight:900; font-size:22px; }
  .best-label{ font-size:10px; color:var(--sub-ink); font-weight:800; margin-top:2px; }
  .start-btn{
    width:100%; padding:17px; border:none; border-radius:999px; font-weight:900; font-size:17px; color:white; cursor:pointer;
    background: linear-gradient(90deg, var(--magenta), var(--purple) 55%, var(--cyan)); box-shadow: var(--shadow-strong);
  }

  /* play screen header */
  .status-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .lives{ display:flex; gap:4px; font-size:20px; }
  .life-lost{ opacity:0.25; filter: grayscale(1); }
  .stage-counter{
    font-weight:900; font-size:13px; color: white; letter-spacing:1px;
    background: linear-gradient(90deg, var(--purple), var(--magenta));
    padding: 6px 16px; border-radius: 999px; box-shadow: var(--shadow-strong); display:inline-block;
  }
  .tier-tag{
    font-size:10px; font-weight:900; color: var(--purple); margin-top: 6px; text-align: right;
    background: linear-gradient(90deg, #F1E9FF, #E4F7FF); display:inline-block; padding: 4px 12px;
    border-radius: 999px; letter-spacing: 0.5px; box-shadow: 0 2px 6px rgba(124,58,237,0.12);
  }

  .target-wrap{ text-align:center; margin-bottom:16px; }
  .label-eyebrow{
    font-size: 12px; font-weight: 900; color: var(--purple); letter-spacing: 3px; margin-bottom: 10px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .label-eyebrow::before, .label-eyebrow::after{
    content:''; display:inline-block; width:18px; height:2px; border-radius:2px;
    background: linear-gradient(90deg, var(--magenta), var(--purple), var(--cyan));
  }
  .target-swatch{ width: 100%; height: 130px; border-radius: var(--radius-lg); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04); }
  .prompt-text{
    text-align:center; font-weight: 900; font-size: 15px; margin: 14px 0 12px;
    background: linear-gradient(90deg, #F1E9FF, #E4F7FF); color: var(--ink); display:inline-block; padding: 9px 20px;
    border-radius: 999px; width: 100%; box-sizing: border-box; box-shadow: 0 2px 8px rgba(124,58,237,0.10);
  }
  .prompt-text .accent{
    color: var(--purple); font-size: 18px;
  }
  .hand-grid{ display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; padding: 4px; }
  .card-slot{ position: relative; flex: 0 0 calc(25% - 7.5px); max-width: calc(25% - 7.5px); aspect-ratio: 1/1; min-width: 0; min-height: 0; }
  .color-card{
    width:100%; height:100%; border-radius: var(--radius-md); border: none; cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease; box-shadow: 0 3px 8px rgba(0,0,0,0.08); position: relative;
    box-sizing: border-box;
  }
  .color-card.selected{
    transform: translateY(-4px); box-shadow: 0 10px 20px rgba(124,58,237,0.35);
    outline: 3px solid var(--purple); outline-offset: -3px;
  }
  .check-badge{
    position:absolute; top:2px; right:2px; width:20px; height:20px; border-radius:50%;
    background: var(--lime); display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:900; color:#1E1E2E; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .new-card-badge{
    position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
    background: var(--cyan); display:flex; align-items:center; justify-content:center;
    font-size:9px; font-weight:900; color:white; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .mix-btn{
    width:100%; padding: 16px; border: none; border-radius: 999px; font-weight: 900; font-size: 18px;
    color: white; background: var(--sub-ink); opacity: 0.45; cursor: not-allowed; transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .mix-btn.enabled{
    background: linear-gradient(90deg, var(--magenta), var(--purple) 55%, var(--cyan)); opacity: 1; cursor: pointer; box-shadow: var(--shadow-strong);
  }
  .mix-btn.enabled:active{ transform: scale(0.97); }

  /* round result */
  .result-wrap{ text-align:center; }
  .result-colors{ display:flex; gap:10px; margin: 10px 0 14px; }
  .result-colors > div{ flex:1; }
  .result-swatch{ width:100%; height:90px; border-radius: var(--radius-md); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
  .result-swatch-label{ font-size:11px; font-weight:800; color:var(--sub-ink); margin-top:6px; }
  .match-pct{ font-size: 40px; font-weight: 900; margin: 4px 0 2px; }
  .match-label{ display:inline-block; padding: 5px 18px; border-radius: 999px; font-weight: 900; font-size: 14px; color: white; margin-bottom: 8px; }
  .match-label.MISS{ background: #B0B0BC; }
  .match-label.CLEAR{ background: var(--cyan); }
  .match-label.GOOD{ background: var(--lime); color:#1E1E2E; }
  .match-label.GREAT{ background: var(--yellow); color:#1E1E2E; }
  .match-label.PERFECT{ background: linear-gradient(90deg, var(--magenta), var(--purple)); }
  .score-text{ font-weight:800; color: var(--sub-ink); margin-bottom:10px; }
  .score-text b{ color: var(--ink); font-size:18px; }
  .life-change{ font-weight:900; font-size:13px; margin-bottom:14px; padding:6px 14px; border-radius:999px; display:inline-block; }
  .life-change.safe{ color:#1E9E4A; background:#E4FBEB; }
  .life-change.danger{ color:#D6273B; background:#FFE6E8; }
  .next-btn{
    width:100%; padding:15px; border:none; border-radius:999px; font-weight:900; font-size:16px; color:white; cursor:pointer;
    background: linear-gradient(90deg, var(--purple), var(--cyan)); box-shadow: var(--shadow-strong); margin-top: 6px;
  }

  /* game over */
  .over-wrap{ text-align:center; }
  .over-title{ font-weight:900; font-size:22px; color: var(--danger); letter-spacing:1px; margin-bottom:14px; }
  .over-stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin: 14px 0 8px; }
  .over-stat{ background:#F7F7F7; border-radius:16px; padding:14px 6px; }
  .over-stat-num{ font-weight:900; font-size:24px; }
  .over-stat-label{ font-size:10px; color:var(--sub-ink); font-weight:800; margin-top:2px; }
  .new-record{
    display:inline-block; margin: 8px 4px; padding: 5px 14px; border-radius:999px;
    background: linear-gradient(90deg, var(--yellow), #FF9500); color:#1E1E2E; font-weight:900; font-size:12px;
  }
  .retry-btn{
    width:100%; padding:16px; border:none; border-radius:999px; font-weight:900; font-size:16px; color:white; cursor:pointer;
    background: linear-gradient(90deg, var(--magenta), var(--purple)); box-shadow: var(--shadow-strong); margin-top: 14px;
  }

  .debug-toggle{ text-align:center; font-size:11px; color:var(--sub-ink); margin-top: 18px; cursor:pointer; text-decoration: underline; }
  .debug-panel{
    margin-top: 10px; background: #1E1E2E; color: #B8FFB8; border-radius: var(--radius-md); padding: 12px;
    font-family: 'SF Mono', Menlo, monospace; font-size: 11px; max-height: 220px; overflow-y: auto; display: none; line-height: 1.6;
  }
  .debug-panel.open{ display:block; }
</style>
</head>

<script>
/* =========================================================
   SE / Haptics (44章/49章/50章)
   ========================================================= */
const LS_SOUND = 'mixcolor_settings_sound';
const LS_HAPTICS = 'mixcolor_settings_haptics';
const SettingsFlags = {
  soundOn: localStorage.getItem(LS_SOUND) !== 'off',
  hapticsOn: localStorage.getItem(LS_HAPTICS) !== 'off',
};
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freqStart, freqEnd, durationMs, type = 'sine', gainPeak = 0.18) {
  if (!SettingsFlags.soundOn) return;
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    const now = ctx.currentTime;
    osc.frequency.setValueAtTime(freqStart, now);
    osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd, 1), now + durationMs / 1000);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(gainPeak, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, now + durationMs / 1000);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + durationMs / 1000 + 0.02);
  } catch (e) {}
}
const SE = {
  mix: () => playTone(300, 900, 260, 'triangle', 0.2),
  clear: () => playTone(600, 800, 150, 'sine', 0.16),
  good: () => playTone(700, 1000, 180, 'sine', 0.18),
  great: () => { playTone(700, 1050, 140, 'sine', 0.18); setTimeout(() => playTone(1050, 1300, 160, 'sine', 0.18), 100); },
  perfect: () => { [0, 90, 180].forEach((d, i) => setTimeout(() => playTone(700 + i * 220, 1000 + i * 260, 180, 'sine', 0.2), d)); },
  miss: () => playTone(220, 140, 220, 'sawtooth', 0.12),
  lifeLost: () => playTone(500, 180, 300, 'sawtooth', 0.16),
};
function hapticFeedback(kind) {
  if (!SettingsFlags.hapticsOn || !('vibrate' in navigator)) return;
  const patterns = { light: 8, medium: 20, success: [15, 30, 15], failure: 40 };
  try { navigator.vibrate(patterns[kind] ?? 10); } catch (e) {}
}
function playResultFeedback(label, lifeLost) {
  if (label === 'PERFECT') { SE.perfect(); hapticFeedback('success'); }
  else if (label === 'GREAT') { SE.great(); hapticFeedback('success'); }
  else if (label === 'GOOD') { SE.good(); hapticFeedback('light'); }
  else if (label === 'CLEAR') { SE.clear(); hapticFeedback('light'); }
  else { SE.miss(); hapticFeedback('failure'); }

   0. CONFIG (TUNABLE)
   ========================================================= */
const MATCH_CURVE_K = 0.03;
const INITIAL_LIVES = 3;
const CLEAR_THRESHOLD = 85.0; // これ未満でライフ-1
const MAX_HAND = 7;
const MAX_SELECT = 3;
const GEN_TARGET_ATTEMPTS = 25; // 1ラウンドの「正解セット選び直し」試行上限
const REPLACEMENT_BIAS_ATTEMPTS = 15;

// 8.3章: ステージ進行に応じた hand_size / required_selection_count / confusability の上昇曲線。TUNABLE。
const SURVIVAL_TIERS = [
  { minStage: 1,  hand: 4, select: 2, confRange: [45, 80] },
  { minStage: 4,  hand: 5, select: 2, confRange: [35, 65] },
  { minStage: 7,  hand: 5, select: 2, confRange: [25, 50] },
  { minStage: 10, hand: 6, select: 2, confRange: [18, 38] },
  { minStage: 13, hand: 6, select: 3, confRange: [14, 30] },
  { minStage: 16, hand: 7, select: 3, confRange: [10, 22] },
  { minStage: 20, hand: 7, select: 3, confRange: [6, 16] },
];
function tierForStage(stage) {
  let t = SURVIVAL_TIERS[0];
  for (const tier of SURVIVAL_TIERS) if (stage >= tier.minStage) t = tier;
  return t;
}

const STORAGE_KEY_BEST_STAGE = 'mixcolor_singleB_bestStage';
const STORAGE_KEY_BEST_SCORE = 'mixcolor_singleB_bestScore';

/* =========================================================
   1. COLOR MATH
   ========================================================= */
function srgbToXyz(r, g, b) {
  const toLinear = c => (c <= 0.04045) ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  const rl = toLinear(r / 255), gl = toLinear(g / 255), bl = toLinear(b / 255);
  return {
    x: rl * 0.4124564 + gl * 0.3575761 + bl * 0.1804375,
    y: rl * 0.2126729 + gl * 0.7151522 + bl * 0.0721750,
    z: rl * 0.0193339 + gl * 0.1191920 + bl * 0.9503041,
  };
}
function xyzToLab(x, y, z) {
  const Xn = 0.95047, Yn = 1.0, Zn = 1.08883;
  const f = t => (t > 0.008856) ? Math.cbrt(t) : (7.787 * t + 16 / 116);
  const fx = f(x / Xn), fy = f(y / Yn), fz = f(z / Zn);
  return { L: 116 * fy - 16, a: 500 * (fx - fy), b: 200 * (fy - fz) };
}
function srgbToLab(r, g, b) { const { x, y, z } = srgbToXyz(r, g, b); return xyzToLab(x, y, z); }

function deltaE00(lab1, lab2) {
  const { L: L1, a: a1, b: b1 } = lab1;
  const { L: L2, a: a2, b: b2 } = lab2;
  const C1 = Math.sqrt(a1 * a1 + b1 * b1);
  const C2 = Math.sqrt(a2 * a2 + b2 * b2);
  const avgC = (C1 + C2) / 2;
  const G = 0.5 * (1 - Math.sqrt(Math.pow(avgC, 7) / (Math.pow(avgC, 7) + Math.pow(25, 7))));
  const a1p = a1 * (1 + G), a2p = a2 * (1 + G);
  const C1p = Math.sqrt(a1p * a1p + b1 * b1);
  const C2p = Math.sqrt(a2p * a2p + b2 * b2);
  const avgCp = (C1p + C2p) / 2;
  let h1p = Math.atan2(b1, a1p) * 180 / Math.PI; if (h1p < 0) h1p += 360;
  let h2p = Math.atan2(b2, a2p) * 180 / Math.PI; if (h2p < 0) h2p += 360;
  let deltahp;
  if (C1p * C2p === 0) deltahp = 0;
  else if (Math.abs(h1p - h2p) <= 180) deltahp = h2p - h1p;
  else if (h2p <= h1p) deltahp = h2p - h1p + 360;
  else deltahp = h2p - h1p - 360;
  const deltaLp = L2 - L1;
  const deltaCp = C2p - C1p;
  const deltaHp = 2 * Math.sqrt(C1p * C2p) * Math.sin(deltahp * Math.PI / 360);
  const avgLp = (L1 + L2) / 2;
  let avgHp;
  if (C1p * C2p === 0) avgHp = h1p + h2p;
  else if (Math.abs(h1p - h2p) <= 180) avgHp = (h1p + h2p) / 2;
  else if ((h1p + h2p) < 360) avgHp = (h1p + h2p + 360) / 2;
  else avgHp = (h1p + h2p - 360) / 2;
  const T = 1 - 0.17 * Math.cos((avgHp - 30) * Math.PI / 180)
              + 0.24 * Math.cos(2 * avgHp * Math.PI / 180)
              + 0.32 * Math.cos((3 * avgHp + 6) * Math.PI / 180)
              - 0.20 * Math.cos((4 * avgHp - 63) * Math.PI / 180);
  const deltaTheta = 30 * Math.exp(-Math.pow((avgHp - 275) / 25, 2));
  const Rc = 2 * Math.sqrt(Math.pow(avgCp, 7) / (Math.pow(avgCp, 7) + Math.pow(25, 7)));
  const Sl = 1 + (0.015 * Math.pow(avgLp - 50, 2)) / Math.sqrt(20 + Math.pow(avgLp - 50, 2));
  const Sc = 1 + 0.045 * avgCp;
  const Sh = 1 + 0.015 * avgCp * T;
  const Rt = -Math.sin(2 * deltaTheta * Math.PI / 180) * Rc;
  return Math.sqrt(
    Math.pow(deltaLp / Sl, 2) + Math.pow(deltaCp / Sc, 2) + Math.pow(deltaHp / Sh, 2) +
    Rt * (deltaCp / Sc) * (deltaHp / Sh)
  );
}
function matchPercent(rgbA, rgbB) {
  if (rgbA.r === rgbB.r && rgbA.g === rgbB.g && rgbA.b === rgbB.b) return 100.0;
  const de = deltaE00(srgbToLab(rgbA.r, rgbA.g, rgbA.b), srgbToLab(rgbB.r, rgbB.g, rgbB.b));
  const raw = 100 / (1 + MATCH_CURVE_K * de);
  return Math.min(99.9, raw);
}
function matchLabel(match) {
  if (match === 100.0) return 'PERFECT';
  if (match >= 97.0) return 'GREAT';
  if (match >= 92.0) return 'GOOD';
  if (match >= 85.0) return 'CLEAR';
  return 'MISS';
}
function mixColors(colors) {
  const n = colors.length;
  const r = Math.round(colors.reduce((s, c) => s + c.r, 0) / n);
  const g = Math.round(colors.reduce((s, c) => s + c.g, 0) / n);
  const b = Math.round(colors.reduce((s, c) => s + c.b, 0) / n);
  return { r, g, b };
}
function toHex({ r, g, b }) {
  const h = v => v.toString(16).padStart(2, '0');
  return '#' + h(r) + h(g) + h(b);
}

/* =========================================================
   2. HELPERS
   ========================================================= */
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function clamp255(v) { return Math.max(0, Math.min(255, v)); }
function randomColor() { return { r: randInt(0, 255), g: randInt(0, 255), b: randInt(0, 255) }; }
function colorDist(a, b) { return Math.sqrt((a.r - b.r) ** 2 + (a.g - b.g) ** 2 + (a.b - b.b) ** 2); }

function combinations(arr, k) {
  const results = [];
  function rec(start, combo) {
    if (combo.length === k) { results.push(combo.slice()); return; }
    for (let i = start; i < arr.length; i++) { combo.push(arr[i]); rec(i + 1, combo); combo.pop(); }
  }
  rec(0, []);
  return results;
}

// RGB -> 大まかな色相バケット分類 (偏り補正用)
function colorBucket(c) {
  const r = c.r / 255, g = c.g / 255, b = c.b / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const l = (max + min) / 2;
  const d = max - min;
  const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
  if (s < 0.15) return 'neutral';
  let h;
  if (d === 0) h = 0;
  else if (max === r) h = 60 * (((g - b) / d) % 6);
  else if (max === g) h = 60 * ((b - r) / d + 2);
  else h = 60 * ((r - g) / d + 4);
  if (h < 0) h += 360;
  if (h >= 345 || h < 15) return 'red';
  if (h < 75) return 'orange_yellow';
  if (h < 165) return 'green';
  if (h < 195) return 'cyan';
  if (h < 255) return 'blue';
  return 'purple_magenta';
}

/* =========================================================
   3. 補充カード生成 (8.2章: 完全ランダム禁止 + 偏り補正)
   ========================================================= */
function generateReplacementColor(currentHandColors) {
  const buckets = ['neutral', 'red', 'orange_yellow', 'green', 'cyan', 'blue', 'purple_magenta'];
  const counts = {};
  buckets.forEach(b => counts[b] = 0);
  currentHandColors.forEach(c => counts[colorBucket(c)]++);
  const avg = currentHandColors.length / buckets.length;

  let candidate = randomColor();
  for (let i = 0; i < REPLACEMENT_BIAS_ATTEMPTS; i++) {
    candidate = randomColor();
    const bucket = colorBucket(candidate);
    const freq = counts[bucket];
    // 同系統が過剰なら高確率で棄却し再抽選(=偏り補正)。ただし完全排除はしない。
    const overloaded = freq > avg * 1.6;
    if (overloaded && Math.random() < 0.75) continue;
    break;
  }
  return candidate;
}

/* =========================================================
   4. ラウンドの正解セット選定 + 検証
   ========================================================= */
function pickCorrectSetAndTarget(hand, selectCount) {
  let bestChoice = null;
  for (let attempt = 0; attempt < GEN_TARGET_ATTEMPTS; attempt++) {
    const idxs = [];
    const pool = hand.map((_, i) => i);
    for (let k = 0; k < selectCount; k++) {
      const pick = pool.splice(randInt(0, pool.length - 1), 1)[0];
      idxs.push(pick);
    }
    const correctCards = idxs.map(i => hand[i]);
    const target = mixColors(correctCards);
    const allCombos = combinations(hand.map((_, i) => i), selectCount).map(cIdxs => {
      const mixed = mixColors(cIdxs.map(i => hand[i]));
      return { idxs: cIdxs, match: matchPercent(mixed, target) };
    });
    const clearRatio = allCombos.filter(r => r.match >= CLEAR_THRESHOLD).length / allCombos.length;
    const choice = { correctIdxs: idxs, target, allCombos, clearRatio };
    // ラウンド内で「他の組み合わせも高確率でCLEAR以上」になっていないものを優先採用
    if (clearRatio <= 0.34) return { ...choice, attempts: attempt + 1 };
    if (!bestChoice || clearRatio < bestChoice.clearRatio) bestChoice = choice;
  }
  return { ...bestChoice, attempts: GEN_TARGET_ATTEMPTS, forced: true };
}

/* =========================================================
   5. LOCAL STORAGE
   ========================================================= */
function loadBestStage() { const v = parseInt(localStorage.getItem(STORAGE_KEY_BEST_STAGE), 10); return Number.isFinite(v) ? v : 0; }
function loadBestScore() { const v = parseInt(localStorage.getItem(STORAGE_KEY_BEST_SCORE), 10); return Number.isFinite(v) ? v : 0; }
function saveBestStage(v) { localStorage.setItem(STORAGE_KEY_BEST_STAGE, String(v)); }
function saveBestScore(v) { localStorage.setItem(STORAGE_KEY_BEST_SCORE, String(v)); }

/* =========================================================
   6. GAME STATE
   ========================================================= */
let cardIdCounter = 0;
function makeCard(rgb) { return { id: 'c' + (cardIdCounter++), r: rgb.r, g: rgb.g, b: rgb.b, isNew: false }; }

let game = {
  screen: 'start',
  stage: 1,
  lives: INITIAL_LIVES,
  totalScore: 0,
  hand: [],
  selectedIds: [],
  currentRound: null, // { correctIdxs, target, allCombos, tier }
  lastResult: null,
};

function currentTier() { return tierForStage(game.stage); }

function ensureHandSize(tier) {
  const colors = game.hand.map(c => ({ r: c.r, g: c.g, b: c.b }));
  while (game.hand.length < Math.min(tier.hand, MAX_HAND)) {
    const rgb = generateReplacementColor(colors);
    colors.push(rgb);
    const card = makeCard(rgb);
    card.isNew = true;
    game.hand.push(card);
  }
}

function startNewRun() {
  cardIdCounter = 0;
  game.stage = 1;
  game.lives = INITIAL_LIVES;
  game.totalScore = 0;
  game.hand = [];
  const tier = currentTier();
  ensureHandSize(tier);
  startRound();
}

function startRound() {
  const tier = currentTier();
  ensureHandSize(tier);
  game.hand.forEach(c => c.isNew = false); // 表示演出は初回のみ
  const selectCount = Math.min(tier.select, MAX_SELECT);
  const roundHandColors = game.hand.map(c => ({ r: c.r, g: c.g, b: c.b }));
  const picked = pickCorrectSetAndTarget(game.hand, selectCount);
  game.currentRound = { ...picked, selectCount, tier };
  game.selectedIds = [];
  showScreen('play');
  renderPlay();
  renderDebug();
}

/* =========================================================
   7. SCREEN CONTROL
   ========================================================= */
function showScreen(name) {
  game.screen = name;
  document.getElementById('startScreen').style.display = name === 'start' ? '' : 'none';
  document.getElementById('playScreen').style.display = name === 'play' ? '' : 'none';
  document.getElementById('roundResultScreen').style.display = name === 'roundResult' ? '' : 'none';
  document.getElementById('gameOverScreen').style.display = name === 'gameOver' ? '' : 'none';
}

function renderStart() {
  document.getElementById('bestStageNum').textContent = loadBestStage();
  document.getElementById('bestScoreNum').textContent = loadBestScore();
}

function renderPlay() {
  const round = game.currentRound;
  document.getElementById('stageCounter').textContent = `STAGE ${game.stage}`;
  document.getElementById('tierTag').textContent =
    `HAND ${game.hand.length} / SELECT ${round.selectCount}`;

  const livesEl = document.getElementById('livesDisplay');
  livesEl.innerHTML = '';
  for (let i = 0; i < INITIAL_LIVES; i++) {
    const span = document.createElement('span');
    span.textContent = '❤️';
    if (i >= game.lives) span.className = 'life-lost';
    livesEl.appendChild(span);
  }

  document.getElementById('targetSwatch').style.background = toHex(round.target);
  document.getElementById('promptText').innerHTML = `<span class="accent">${round.selectCount}色</span>選んでMIX！`;

  const grid = document.getElementById('handGrid');
  grid.innerHTML = '';
  game.hand.forEach(card => {
    const slot = document.createElement('div');
    slot.className = 'card-slot';
    const btn = document.createElement('button');
    const selected = game.selectedIds.includes(card.id);
    btn.className = 'color-card' + (selected ? ' selected' : '');
    btn.style.background = toHex(card);
    btn.onclick = () => onCardTap(card.id);
    slot.appendChild(btn);
    if (selected) {
      const badge = document.createElement('div');
      badge.className = 'check-badge';
      badge.textContent = game.selectedIds.indexOf(card.id) + 1;
      slot.appendChild(badge);
    } else if (card.isNew) {
      const nb = document.createElement('div');
      nb.className = 'new-card-badge';
      nb.textContent = 'NEW';
      nb.style.fontSize = '7px';
      slot.appendChild(nb);
    }
    grid.appendChild(slot);
  });

  const mixBtn = document.getElementById('mixBtn');
  const ready = game.selectedIds.length === round.selectCount;
  mixBtn.className = 'mix-btn' + (ready ? ' enabled' : '');
  mixBtn.onclick = ready ? onMix : null;
}

function onCardTap(cardId) {
  const round = game.currentRound;
  const idx = game.selectedIds.indexOf(cardId);
  if (idx >= 0) game.selectedIds.splice(idx, 1);
  else if (game.selectedIds.length < round.selectCount) game.selectedIds.push(cardId);
  renderPlay();
}

function onMix() {
  const round = game.currentRound;
  const selectedCards = game.selectedIds.map(id => game.hand.find(c => c.id === id));
  const mixed = mixColors(selectedCards);
  const match = matchPercent(mixed, round.target);
  const label = matchLabel(match);
  const score = Math.round(match * 10);

  const lifeLost = match < CLEAR_THRESHOLD;
  if (lifeLost) game.lives -= 1;
  game.totalScore += score;

  // 使用したカードを消費し、同数だけ偏り補正付きで補充 (8.2章)
  const remainingHand = game.hand.filter(c => !game.selectedIds.includes(c.id));
  const consumedCount = game.selectedIds.length;
  const remainingColors = remainingHand.map(c => ({ r: c.r, g: c.g, b: c.b }));
  const newCards = [];
  for (let i = 0; i < consumedCount; i++) {
    const rgb = generateReplacementColor([...remainingColors, ...newCards]);
    const card = makeCard(rgb);
    card.isNew = true;
    newCards.push(card);
  }
  game.hand = [...remainingHand, ...newCards];

  game.lastResult = { mixed, match, label, score, lifeLost };
  showScreen('roundResult');
  renderRoundResult();
  setTimeout(() => playResultFeedback(label, lifeLost), 200);
}

function renderRoundResult() {
  const round = game.currentRound;
  const { mixed, match, label, score, lifeLost } = game.lastResult;
  document.getElementById('resTarget').style.background = toHex(round.target);
  document.getElementById('resMixed').style.background = toHex(mixed);
  document.getElementById('matchPct').textContent = match.toFixed(1) + '%';
  const labelEl = document.getElementById('matchLabel');
  labelEl.textContent = label;
  labelEl.className = 'match-label ' + label;
  document.getElementById('scoreText').textContent = score;

  const lifeEl = document.getElementById('lifeChangeText');
  if (lifeLost) {
    lifeEl.textContent = `85%未満…ライフ -1 (残り${game.lives})`;
    lifeEl.className = 'life-change danger';
  } else {
    lifeEl.textContent = 'CLEAR以上！ライフ変化なし';
    lifeEl.className = 'life-change safe';
  }

  const nextBtn = document.getElementById('nextRoundBtn');
  if (game.lives <= 0) {
    nextBtn.textContent = 'GAME OVERを見る';
    nextBtn.onclick = () => finishGame();
  } else {
    nextBtn.textContent = 'つぎのステージへ';
    nextBtn.onclick = () => { game.stage += 1; startRound(); };
  }
}

function finishGame() {
  const bestStage = loadBestStage();
  const bestScore = loadBestScore();
  const reachedStage = game.stage;
  const newStageRecord = reachedStage > bestStage;
  const newScoreRecord = game.totalScore > bestScore;
  if (newStageRecord) saveBestStage(reachedStage);
  if (newScoreRecord) saveBestScore(game.totalScore);

  showScreen('gameOver');
  document.getElementById('finalStage').textContent = reachedStage;
  document.getElementById('finalScore').textContent = game.totalScore;
  document.getElementById('overBestStage').textContent = Math.max(reachedStage, bestStage);
  document.getElementById('overBestScore').textContent = Math.max(game.totalScore, bestScore);

  const badges = document.getElementById('recordBadges');
  badges.innerHTML = '';
  if (newStageRecord) { const b = document.createElement('span'); b.className = 'new-record'; b.textContent = 'NEW MAX STAGE!'; badges.appendChild(b); }
  if (newScoreRecord) { const b = document.createElement('span'); b.className = 'new-record'; b.textContent = 'NEW BEST SCORE!'; badges.appendChild(b); }

  document.getElementById('retryBtn').onclick = () => startNewRun();
}

/* =========================================================
   8. DEBUG PANEL
   ========================================================= */
function renderDebug() {
  const panel = document.getElementById('debugPanel');
  const round = game.currentRound;
  const buckets = {};
  game.hand.forEach(c => { const b = colorBucket(c); buckets[b] = (buckets[b] || 0) + 1; });
  const lines = [];
  lines.push(`STAGE ${game.stage}  tier: hand=${round.tier.hand} select=${round.tier.select} conf=${round.tier.confRange}`);
  lines.push(`TARGET = ${toHex(round.target)}  正解カード = [${round.correctIdxs.join(',')}]`);
  lines.push(`正解セット選定試行回数 = ${round.attempts}${round.forced ? ' (基準未達フォールバック)' : ''}`);
  lines.push(`CLEAR以上率(全組合せ) = ${(round.clearRatio * 100).toFixed(1)}%`);
  lines.push(`ハンド色相バケット分布 = ${JSON.stringify(buckets)}`);
  lines.push(`lives=${game.lives} totalScore=${game.totalScore}`);
  panel.innerHTML = lines.join('<br>');
}
document.getElementById('debugToggle').onclick = () => document.getElementById('debugPanel').classList.toggle('open');

/* =========================================================
   INIT
   ========================================================= */
document.getElementById('startBtn').onclick = () => startNewRun();
document.getElementById('startScreen').style.backgroundImage = `url(${SURVIVAL_BG_DATA_URI})`;
document.getElementById('gameOverScreen').style.backgroundImage = `url(${SURVIVAL_BG_DATA_URI})`;
document.getElementById('homeBtnSurvival').onclick = () => { window.location.href = 'index.html'; };
showScreen('start');
renderStart();
</script>
