<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MIX COLOR! - MULTIPLAYER</title>
<style>
  :root{
    --bg:#F7F7F7; --card-bg:#FFFFFF; --ink:#1E1E2E; --sub-ink:#8A8A9A;
    --magenta:#FF2E9A; --cyan:#00C2FF; --purple:#7C3AED; --yellow:#FFD400; --lime:#A6FF00;
    --radius-lg:28px; --radius-md:18px;
    --shadow:0 6px 18px rgba(30,30,46,0.10); --shadow-strong:0 10px 28px rgba(124,58,237,0.25);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);overflow-x:hidden;
    font-family:'Hiragino Maru Gothic ProN','Rounded Mplus 1c','Hiragino Sans','Yu Gothic',sans-serif;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;padding:18px 18px 34px;overflow-x:hidden;}
  .logo{ text-align:center; margin-bottom:10px; }
  .logo img{ height:40px; max-width:70%; object-fit:contain; }
  .panel{background:var(--card-bg);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:800;color:var(--sub-ink);margin-bottom:6px;}
  .field input, .field select{
    width:100%;padding:13px 14px;border-radius:14px;border:2px solid #ECECF2;font-size:15px;
    font-weight:700;color:var(--ink);background:#FAFAFC;
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--purple);}
  .primary-btn{
    width:100%;padding:16px;border:none;border-radius:999px;font-weight:900;font-size:16px;color:white;
    cursor:pointer;background:linear-gradient(90deg,var(--magenta),var(--purple) 55%,var(--cyan));
    box-shadow:var(--shadow-strong);
  }
  .primary-btn:disabled{opacity:0.4;cursor:not-allowed;}
  .secondary-btn{
    width:100%;padding:15px;border:2px solid #ECECF2;border-radius:999px;font-weight:900;font-size:15px;
    color:var(--ink);background:white;cursor:pointer;margin-top:10px;
  }
  .entry-cards{display:flex;flex-direction:column;gap:12px;}
  .entry-card{
    border:none;border-radius:var(--radius-md);padding:20px;text-align:left;cursor:pointer;color:white;
  }
  .entry-card.create{background:linear-gradient(135deg,var(--magenta),var(--purple));}
  .entry-card.join{background:linear-gradient(135deg,var(--cyan),#4CC9FF);}
  .entry-card .t{font-weight:900;font-size:17px;}
  .entry-card .s{font-size:12px;opacity:0.9;margin-top:4px;}
  .back-link{font-size:12px;font-weight:800;color:var(--sub-ink);margin-bottom:14px;cursor:pointer;display:inline-block;}
  .error-box{
    background:#FFE6E8;color:#D6273B;border-radius:14px;padding:10px 14px;font-size:13px;font-weight:700;
    margin-bottom:14px; display:none;
  }
  .room-code-box{text-align:center;margin-bottom:16px;}
  .room-code-label{font-size:11px;font-weight:800;color:var(--sub-ink);letter-spacing:2px;margin-bottom:6px;}
  .room-code{font-size:36px;font-weight:900;letter-spacing:4px;}
  .room-meta{font-size:12px;color:var(--sub-ink);font-weight:700;margin-top:6px;}
  .player-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
  .player-chip{
    background:#F7F7F7;border-radius:14px;padding:10px 12px;font-weight:800;font-size:13px;
    display:flex;align-items:center;gap:6px;
  }
  .player-chip .crown{font-size:14px;}
  .waiting-note{text-align:center;font-size:13px;color:var(--sub-ink);font-weight:700;margin-top:10px;}

  /* ---------- 3-2-1 カウントダウン ---------- */
  .countdown-wrap{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:60vh; text-align:center;
  }
  .countdown-ready{ font-weight:900; font-size:20px; color:var(--sub-ink); letter-spacing:3px; margin-bottom:14px; }
  .countdown-number{
    font-weight:900; font-size:96px;
    background: linear-gradient(90deg, var(--magenta), var(--purple) 55%, var(--cyan));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .countdown-go{ font-weight:900; font-size:44px; color:var(--purple); }

  /* ---------- ラウンドプレイ ---------- */
  .round-status-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .round-counter{ font-weight:900; font-size:14px; }
  .round-timer{ font-weight:900; font-size:20px; color:var(--purple); }
  .round-timer.urgent{ color:#D6273B; }
  .answered-count{ font-size:11px; font-weight:800; color:var(--sub-ink); }

  .waiting-wrap{ text-align:center; padding: 30px 10px; }
  .waiting-icon{ font-size:44px; margin-bottom:10px; }
  .waiting-title{ font-weight:900; font-size:18px; margin-bottom:6px; }
  .waiting-sub{ font-size:13px; color:var(--sub-ink); font-weight:700; }
  .waiting-progress{ font-weight:900; font-size:15px; color:var(--purple); margin-top:14px; }

  /* ---------- ラウンド結果シーケンス ---------- */
  .reveal-step-label{ font-size:11px; font-weight:800; color:var(--sub-ink); letter-spacing:2px; text-align:center; margin-bottom:10px; }
  .reveal-target-row{ text-align:center; margin-bottom:14px; }
  .reveal-target-swatch{ width:70px; height:70px; border-radius:18px; display:inline-block; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
  .reveal-list{ display:flex; flex-direction:column; gap:10px; }
  .reveal-row{
    display:flex; align-items:center; gap:12px; background:#F7F7F7; border-radius:16px; padding:10px 12px;
    opacity:0; transform: translateY(8px); transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .reveal-row.show{ opacity:1; transform:translateY(0); }
  .reveal-row.me{ background:#F1E9FF; outline:2px solid var(--purple); }
  .reveal-rank{ font-weight:900; font-size:15px; width:22px; text-align:center; color:var(--sub-ink); }
  .reveal-swatch{ width:38px; height:38px; border-radius:10px; flex:0 0 auto; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
  .reveal-name{ font-weight:800; font-size:13px; flex:1; }
  .reveal-pct{ font-weight:900; font-size:14px; width:52px; text-align:right; }
  .reveal-score{ font-weight:900; font-size:13px; width:58px; text-align:right; color:var(--purple); }
  .reveal-total{ font-weight:900; font-size:13px; width:64px; text-align:right; color:var(--sub-ink); }


  .in-game-leave-btn{
    width:100%;padding:12px 14px;border:2px solid #ECECF2;border-radius:999px;font-weight:900;font-size:13px;
    color:var(--sub-ink);background:white;cursor:pointer;margin-top:12px;
  }

  /* ---------- FINAL RESULT ---------- */
  .final-bg-wrap{
    border-radius: var(--radius-lg); overflow:hidden; position:relative; margin-bottom:14px;
    box-shadow: var(--shadow);
  }
  .final-bg-img{ width:100%; display:block; }
  .final-overlay{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 24px;
  }
  .final-label{ font-weight:900; font-size:13px; letter-spacing:4px; color:white; text-shadow:0 2px 8px rgba(0,0,0,0.25); }
  .final-winner-tag{ font-weight:900; font-size:28px; color:white; text-shadow:0 3px 10px rgba(0,0,0,0.3); margin:4px 0 2px; }
  .final-winner-name{ font-weight:900; font-size:22px; color:white; text-shadow:0 3px 10px rgba(0,0,0,0.3); }
  .final-ranking{ display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  .final-row{
    display:flex; align-items:center; gap:10px; background:white; border-radius:14px; padding:10px 12px;
    box-shadow: var(--shadow);
  }
  .final-row.top{ background: linear-gradient(90deg,#FFF7DB,#FFFDF2); }
  .final-row.me{ outline: 2px solid var(--purple); }
  .final-rank{ font-weight:900; font-size:14px; width:22px; text-align:center; }
  .final-swatch{ width:32px; height:32px; border-radius:9px; flex:0 0 auto; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
  .final-name{ font-weight:800; font-size:13px; flex:1; }
  .final-score{ font-weight:900; font-size:14px; }
  .final-btn-row{ display:flex; gap:10px; margin-top:16px; }
</style>
</head>
<body>
<div id="app">
  <div class="logo"><img src="mix_color_logo.png" alt="MIX COLOR!"></div>
<div class="error-box" id="errorBox"></div>

  <!-- エントリー画面 -->
  <div id="entryScreen">
    <div style="text-align:right;margin-bottom:8px;">
      <button id="homeBtnMulti" style="border:none;background:white;box-shadow:var(--shadow);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;">🏠</button>
    </div>
    <div class="entry-cards">
      <button class="entry-card create" id="toCreateBtn">
        <div class="t">ルームを作る</div>
        <div class="s">コードを発行してみんなを招待</div>
      </button>
      <button class="entry-card join" id="toJoinBtn">
        <div class="t">ルームに入る</div>
        <div class="s">もらったコードで参加</div>
      </button>
    </div>
  </div>

  <!-- ルーム作成 -->
  <div id="createScreen" style="display:none;">
    <span class="back-link" id="backFromCreate">‹ もどる</span>
    <div class="panel">
      <div class="field">
        <label>プレイヤー名</label>
        <input type="text" id="createNameInput" maxlength="10" placeholder="ニックネーム">
      </div>
      <div class="field">
        <label>難易度</label>
        <select id="createDifficultySelect">
          <option value="EASY">EASY はじめて向け</option>
          <option value="NORMAL" selected>NORMAL おすすめ</option>
          <option value="HARD">HARD むずかしい</option>
          <option value="EXPERT">EXPERT かなりむずかしい</option>
          <option value="MASTER">MASTER 最高難度</option>
        </select>
      </div>
      <div class="room-meta" style="text-align:center;margin-bottom:16px;">5 ROUND / 20 SEC / 最大8人</div>
      <button class="primary-btn" id="submitCreateBtn">ルームを作る</button>
    </div>
  </div>

  <!-- ルーム参加 -->
  <div id="joinScreen" style="display:none;">
    <span class="back-link" id="backFromJoin">‹ もどる</span>
    <div class="panel">
      <div class="field">
        <label>ルームコード</label>
        <input type="text" id="joinCodeInput" maxlength="6" inputmode="numeric" placeholder="123456">
      </div>
      <div class="field">
        <label>プレイヤー名</label>
        <input type="text" id="joinNameInput" maxlength="10" placeholder="ニックネーム">
      </div>
      <button class="primary-btn" id="submitJoinBtn">参加する</button>
    </div>
  </div>

  <!-- ロビー -->
  <div id="lobbyScreen" style="display:none;">
    <div class="panel">
      <div class="room-code-box">
        <div class="room-code-label">ROOM CODE</div>
        <div class="room-code" id="lobbyRoomCode">000 000</div>
        <div class="room-meta" id="lobbyMeta">NORMAL | 5 ROUND | 20 SEC</div>
        <div class="room-meta">プレイヤー <span id="playerCount">0</span> / 8</div>
      </div>
      <div class="player-grid" id="playerGrid"></div>
      <button class="primary-btn" id="startGameBtn" disabled>ゲーム開始！</button>
      <div class="waiting-note" id="waitingNote" style="display:none;">ホストの開始を待っています・・・</div>
      <button class="secondary-btn" id="leaveRoomBtn">ルームを退出</button>
    </div>
  </div>

  <!-- 3-2-1 カウントダウン -->
  <div id="countdownScreen" style="display:none;">
    <div class="countdown-wrap">
      <div class="countdown-ready" id="countdownReady">READY?</div>
      <div class="countdown-number" id="countdownNumber">3</div>
      <button class="in-game-leave-btn js-game-leave-btn">ルームを退出</button>
    </div>
  </div>

  <!-- ラウンドプレイ -->
  <div id="roundPlayScreen" style="display:none;">
    <div class="round-status-row">
      <span class="round-counter" id="roundCounter">ROUND 1 / 5</span>
      <span class="round-timer" id="roundTimer">20</span>
    </div>
    <div class="panel">
      <div class="target-wrap" style="text-align:center;margin-bottom:16px;">
        <div class="room-code-label">TARGET</div>
        <div id="mpTargetSwatch" style="width:100%;height:130px;border-radius:28px;margin-top:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.04);"></div>
      </div>
      <div class="prompt-text" id="mpPromptText" style="text-align:center;font-weight:800;font-size:15px;margin-bottom:10px;"></div>
      <div class="hand-grid" id="mpHandGrid" style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;padding:4px;"></div>
      <button class="primary-btn" id="mpMixBtn" disabled>MIX!</button>
    </div>
    <button class="in-game-leave-btn js-game-leave-btn">ルームを退出</button>
  </div>

  <!-- 回答済み・他プレイヤー待ち -->
  <div id="waitingScreen" style="display:none;">
    <div class="panel waiting-wrap">
      <div class="waiting-icon">⏳</div>
      <div class="waiting-title">回答完了！</div>
      <div class="waiting-sub">ほかのプレイヤーを待っています</div>
      <div class="waiting-progress" id="waitingProgress">回答済み 0 / 0</div>
    </div>
    <button class="in-game-leave-btn js-game-leave-btn">ルームを退出</button>
  </div>

  <!-- ラウンド結果シーケンス -->
  <div id="roundRevealScreen" style="display:none;">
    <div class="panel">
      <div class="reveal-step-label" id="revealStepLabel">ROUND RESULT</div>
      <div class="reveal-target-row">
        <div class="reveal-target-swatch" id="revealTargetSwatch"></div>
      </div>
      <div class="reveal-list" id="revealList"></div>
      <div id="roundReadyArea" style="margin-top:18px;text-align:center;">
        <div id="roundReadyProgress" style="font-weight:800;font-size:14px;margin-bottom:10px;">OK 0 / 0</div>
        <button class="primary-btn" id="roundReadyBtn">OK！</button>
      </div>
    </div>
    <button class="in-game-leave-btn js-game-leave-btn">ルームを退出</button>
  </div>

  <!-- FINAL RESULT -->
  <div id="finalResultScreen" style="display:none;">
    <div class="final-bg-wrap">
      <img class="final-bg-img" id="finalBgImg" src="mixcolor_final_result_background.png" alt="">
      <div class="final-overlay">
        <div class="final-label">FINAL RESULT</div>
        <div class="final-winner-tag" id="finalWinnerTag">WINNER</div>
        <div class="final-winner-name" id="finalWinnerName">---</div>
      </div>
    </div>
    <div class="final-ranking" id="finalRanking"></div>
    <div class="final-btn-row">
      <button class="secondary-btn" id="leaveAfterFinalBtn" style="margin-top:0;">ルームを退出</button>
      <button class="primary-btn" id="rematchBtn">もう一度遊ぶ</button>
    </div>
    <div class="waiting-note" id="rematchWaitingNote" style="display:none;">ホストの再戦を待っています</div>
    <button class="secondary-btn" id="newRoomAfterFinalBtn" style="display:none;">新しいルームを作る</button>
  </div>
</div>

<script type="module">
const SUPABASE_URL = 'https://arpkjnbnyyytdcbzeitk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFycGtqbmJueXl5dGRjYnplaXRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4MDk1NTgsImV4cCI6MjA5OTM4NTU1OH0.wMED0yZ1j6ygAIIPr5zw9As25xx9QqL0YbSICaK6UVo';
const FUNCTIONS_BASE = `${SUPABASE_URL}/functions/v1`;

const LS_ROOM_ID = 'mixcolor_mp_roomId';
const LS_PLAYER_ID = 'mixcolor_mp_playerId';
const LS_RECONNECT_TOKEN = 'mixcolor_mp_reconnectToken';
const LS_LAST_NAME = 'mixcolor_mp_lastName';

const state = {
  roomId: null,
  playerId: null,
  room: null,
  players: [],
  pollTimerId: null,
  syncBusy: false,
  mp: {
    phase: 'idle',
    roundNumber: 0,
    question: null,
    selectedIds: [],
    answered: false,
    answeredCount: 0,
    playerCount: 0,
    countdownTimerId: null,
    playTimerId: null,
    advanceBusy: false,
    nextBusy: false,
    revealRound: 0,
    resultRenderedRound: 0,
    readyBusy: false,
    finalShown: false,
    revealTimeoutIds: [],
  },
};

function log(...args) { console.log('[MIX COLOR]', ...args); }
function toHex(rgb) {
  if (!rgb) return '#D2D2D2';
  const h = v => Math.max(0, Math.min(255, Math.round(Number(v) || 0))).toString(16).padStart(2, '0');
  return '#' + h(rgb.r) + h(rgb.g) + h(rgb.b);
}
function showError(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = msg || '';
  box.style.display = msg ? 'block' : 'none';
}
const ALL_SCREENS = [
  'entryScreen','createScreen','joinScreen','lobbyScreen','countdownScreen',
  'roundPlayScreen','waitingScreen','roundRevealScreen','finalResultScreen'
];
function showScreen(name) {
  ALL_SCREENS.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = id === name ? '' : 'none';
  });
}
function clearRoundTimers() {
  const mp = state.mp;
  if (mp.countdownTimerId) clearInterval(mp.countdownTimerId);
  if (mp.playTimerId) clearInterval(mp.playTimerId);
  mp.revealTimeoutIds.forEach(id => clearTimeout(id));
  mp.countdownTimerId = null;
  mp.playTimerId = null;
  mp.revealTimeoutIds = [];
}
function stopPolling() {
  if (state.pollTimerId) clearInterval(state.pollTimerId);
  state.pollTimerId = null;
}
function authBody(extra={}) {
  return {
    roomId: state.roomId,
    playerId: state.playerId,
    reconnectToken: localStorage.getItem(LS_RECONNECT_TOKEN),
    ...extra,
  };
}
async function callFunction(name, body) {
  const res = await fetch(`${FUNCTIONS_BASE}/${name}`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      apikey: SUPABASE_ANON_KEY,
    },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || '通信に失敗しました。もう一度お試しください');
    err.code = data.error || '';
    err.data = data;
    throw err;
  }
  return data;
}
function isHost() { return !!state.room && state.room.hostPlayerId === state.playerId; }
function progressionDelayMs() {
  const idx = state.players.findIndex(p => p.id === state.playerId);
  return Math.max(0, idx) * 450;
}
function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

/* ---------- Entry / lobby ---------- */
document.getElementById('toCreateBtn').onclick = () => {
  document.getElementById('createNameInput').value = localStorage.getItem(LS_LAST_NAME) || '';
  showScreen('createScreen');
};
document.getElementById('toJoinBtn').onclick = () => {
  document.getElementById('joinNameInput').value = localStorage.getItem(LS_LAST_NAME) || '';
  showScreen('joinScreen');
};
document.getElementById('backFromCreate').onclick = () => showScreen('entryScreen');
document.getElementById('backFromJoin').onclick = () => showScreen('entryScreen');
document.getElementById('homeBtnMulti').onclick = () => { window.location.href = 'index.html'; };

document.getElementById('submitCreateBtn').onclick = async () => {
  const name = document.getElementById('createNameInput').value.trim();
  const difficulty = document.getElementById('createDifficultySelect').value;
  if (!name) return showError('プレイヤー名を入力してください');
  try {
    showError('');
    const data = await callFunction('mixcolor-create-room', { playerName: name, difficulty });
    localStorage.setItem(LS_LAST_NAME, name);
    localStorage.setItem(LS_ROOM_ID, data.roomId);
    localStorage.setItem(LS_PLAYER_ID, data.playerId);
    localStorage.setItem(LS_RECONNECT_TOKEN, data.reconnectToken);
    await enterRoom(data.roomId, data.playerId);
  } catch (e) { showError(e.message); log('create-room', e); }
};

document.getElementById('submitJoinBtn').onclick = async () => {
  const code = document.getElementById('joinCodeInput').value.trim();
  const name = document.getElementById('joinNameInput').value.trim();
  if (!/^\d{6}$/.test(code)) return showError('6桁のルームコードを入力してください');
  if (!name) return showError('プレイヤー名を入力してください');
  try {
    showError('');
    const data = await callFunction('mixcolor-join-room', { roomCode: code, playerName: name });
    localStorage.setItem(LS_LAST_NAME, name);
    localStorage.setItem(LS_ROOM_ID, data.roomId);
    localStorage.setItem(LS_PLAYER_ID, data.playerId);
    localStorage.setItem(LS_RECONNECT_TOKEN, data.reconnectToken);
    await enterRoom(data.roomId, data.playerId);
  } catch (e) { showError(e.message); log('join-room', e); }
};

async function enterRoom(roomId, playerId) {
  state.roomId = roomId;
  state.playerId = playerId;
  state.mp.phase = 'idle';
  state.mp.roundNumber = 0;
  state.mp.question = null;
  state.mp.finalShown = false;
  state.mp.revealRound = 0;
    state.mp.resultRenderedRound = 0;
    state.mp.readyBusy = false;
  await syncNow();
  startPolling();
}
function startPolling() {
  stopPolling();
  state.pollTimerId = setInterval(() => syncNow().catch(e => log('poll', e.message)), 900);
}
async function fetchLobbyState() {
  const data = await callFunction('mixcolor-lobby-state', authBody());
  state.room = {
    id: data.room.id,
    roomCode: data.room.roomCode,
    difficulty: data.room.difficulty,
    status: data.room.status,
    currentRound: data.room.currentRound,
    maxPlayers: data.room.maxPlayers,
    hostPlayerId: data.room.hostPlayerId,
  };
  state.players = (data.players || []).map(p => ({
    id: p.playerId,
    name: p.playerName,
    isHost: p.isHost,
    connectionState: p.connectionState,
    totalScore: p.totalScore,
  }));
  return data;
}
async function syncNow() {
  if (state.syncBusy || !state.roomId || !state.playerId) return;
  state.syncBusy = true;
  try {
    await fetchLobbyState();
    const status = state.room.status;
    if (status === 'lobby') {
      renderLobby();
      if (state.mp.phase !== 'idle') {
        clearRoundTimers();
        state.mp.phase = 'idle';
        state.mp.roundNumber = 0;
        state.mp.question = null;
      }
      showScreen('lobbyScreen');
    } else if (status === 'countdown' || status === 'playing') {
      await syncActiveGame();
    } else if (status === 'round_result') {
      await ensureRoundResult();
    } else if (status === 'final_result') {
      await ensureFinalResult();
    }
  } finally { state.syncBusy = false; }
}
function renderLobby() {
  const code = state.room.roomCode || '000000';
  document.getElementById('lobbyRoomCode').textContent = code.slice(0,3) + ' ' + code.slice(3);
  document.getElementById('lobbyMeta').textContent = `${state.room.difficulty} | 5 ROUND | 20 SEC`;
  document.getElementById('playerCount').textContent = state.players.length;
  const grid = document.getElementById('playerGrid');
  grid.innerHTML = '';
  state.players.forEach(p => {
    const chip = document.createElement('div');
    chip.className = 'player-chip';
    chip.textContent = `${p.isHost ? '👑 ' : ''}${p.name}${p.id === state.playerId ? ' (YOU)' : ''}`;
    grid.appendChild(chip);
  });
  const btn = document.getElementById('startGameBtn');
  const note = document.getElementById('waitingNote');
  if (isHost()) {
    btn.style.display = '';
    btn.disabled = state.players.length < 2;
    note.style.display = 'none';
  } else {
    btn.style.display = 'none';
    note.style.display = '';
  }
}

document.getElementById('startGameBtn').onclick = async () => {
  const btn = document.getElementById('startGameBtn');
  btn.disabled = true;
  try {
    showError('');
    await callFunction('mixcolor-start-game', authBody());
    await syncNow();
  } catch (e) { showError(e.message); log('start-game', e); }
  finally { btn.disabled = false; }
};

/* ---------- Active round ---------- */
async function syncActiveGame() {
  let data;
  try { data = await callFunction('mixcolor-game-state', authBody()); }
  catch (e) {
    if (e.code === 'GAME_NOT_STARTED') return;
    throw e;
  }
  const round = data.round;
  if (!round) return;
  state.mp.answeredCount = data.answeredCount || 0;
  state.mp.playerCount = data.playerCount || state.players.length;
  const isNewRound = state.mp.roundNumber !== round.roundNumber || !state.mp.question;
  if (isNewRound) {
    clearRoundTimers();
    state.mp.roundNumber = round.roundNumber;
    state.mp.question = round;
    state.mp.selectedIds = [];
    state.mp.answered = !!data.answered;
    state.mp.revealRound = 0;
    state.mp.resultRenderedRound = 0;
    state.mp.readyBusy = false;
    beginRound(round);
  } else {
    state.mp.answered = !!data.answered;
    if (state.mp.answered && state.mp.phase !== 'waiting') {
      state.mp.phase = 'waiting';
      showScreen('waitingScreen');
    }
    if (state.mp.phase === 'waiting') renderWaitingProgress();
  }
  const now = Date.now();
  const deadline = new Date(round.deadlineAt).getTime();
  const shouldAdvance = (data.answeredCount >= data.playerCount && data.playerCount > 0) || now >= deadline;
  if (shouldAdvance) await tryAdvanceRound();
}
function beginRound(round) {
  const startMs = new Date(round.startAt).getTime();
  if (state.mp.answered) {
    state.mp.phase = 'waiting';
    showScreen('waitingScreen');
    renderWaitingProgress();
    return;
  }
  if (Date.now() < startMs) {
    state.mp.phase = 'countdown';
    showScreen('countdownScreen');
    runCountdown(round.startAt);
  } else {
    startPlaying();
  }
}
function runCountdown(startAtIso) {
  const startAt = new Date(startAtIso).getTime();
  const readyEl = document.getElementById('countdownReady');
  const numEl = document.getElementById('countdownNumber');
  numEl.classList.remove('countdown-go');
  const tick = () => {
    const remain = startAt - Date.now();
    if (remain <= 0) {
      clearInterval(state.mp.countdownTimerId);
      state.mp.countdownTimerId = null;
      readyEl.style.display = 'none';
      numEl.textContent = 'START!';
      numEl.classList.add('countdown-go');
      const id = setTimeout(startPlaying, 350);
      state.mp.revealTimeoutIds.push(id);
      return;
    }
    if (remain > 3000) { readyEl.style.display = ''; numEl.textContent = ''; }
    else { readyEl.style.display = 'none'; numEl.textContent = String(Math.ceil(remain / 1000)); }
  };
  tick();
  state.mp.countdownTimerId = setInterval(tick, 120);
}
function startPlaying() {
  if (!state.mp.question || state.mp.answered) return;
  state.mp.phase = 'playing';
  showScreen('roundPlayScreen');
  renderRoundPlay();
  runRoundTimer(state.mp.question.deadlineAt);
}
function renderRoundPlay() {
  const q = state.mp.question;
  document.getElementById('roundCounter').textContent = `ROUND ${q.roundNumber} / 5`;
  document.getElementById('mpTargetSwatch').style.background = toHex(q.target);
  document.getElementById('mpPromptText').innerHTML = `<span style="color:var(--purple);">${q.selectCount}色</span>選んでMIX！`;
  const grid = document.getElementById('mpHandGrid');
  grid.innerHTML = '';
  (q.handCards || []).forEach(card => {
    const slot = document.createElement('div');
    slot.style.cssText = 'position:relative;aspect-ratio:1/1;flex:0 0 calc(25% - 7.5px);max-width:calc(25% - 7.5px);min-width:0;';
    const btn = document.createElement('button');
    const selected = state.mp.selectedIds.includes(card.id);
    btn.style.cssText = `width:100%;height:100%;border-radius:18px;border:none;cursor:pointer;background:${toHex(card)};box-shadow:0 3px 8px rgba(0,0,0,0.08);`;
    if (selected) { btn.style.outline = '3px solid var(--purple)'; btn.style.outlineOffset = '-3px'; btn.style.transform = 'translateY(-4px)'; }
    btn.onclick = () => onCardTap(card.id);
    slot.appendChild(btn);
    grid.appendChild(slot);
  });
  const mixBtn = document.getElementById('mpMixBtn');
  const ready = state.mp.selectedIds.length === q.selectCount;
  mixBtn.disabled = !ready;
  mixBtn.onclick = ready ? submitAnswer : null;
}
function onCardTap(cardId) {
  if (state.mp.phase !== 'playing') return;
  const q = state.mp.question;
  const idx = state.mp.selectedIds.indexOf(cardId);
  if (idx >= 0) state.mp.selectedIds.splice(idx,1);
  else if (state.mp.selectedIds.length < q.selectCount) state.mp.selectedIds.push(cardId);
  renderRoundPlay();
}
function runRoundTimer(deadlineAtIso) {
  const deadline = new Date(deadlineAtIso).getTime();
  const timerEl = document.getElementById('roundTimer');
  const tick = () => {
    const remainMs = deadline - Date.now();
    const remain = Math.max(0, Math.ceil(remainMs / 1000));
    timerEl.textContent = remain;
    timerEl.classList.toggle('urgent', remain <= 5);
    if (remainMs <= 0 && state.mp.phase === 'playing') {
      clearInterval(state.mp.playTimerId);
      state.mp.playTimerId = null;
      state.mp.phase = 'waiting';
      showScreen('waitingScreen');
      renderWaitingProgress();
      tryAdvanceRound().catch(e => log('advance deadline', e));
    }
  };
  tick();
  state.mp.playTimerId = setInterval(tick, 200);
}
async function submitAnswer() {
  if (state.mp.phase !== 'playing') return;
  const btn = document.getElementById('mpMixBtn');
  btn.disabled = true;
  try {
    const data = await callFunction('mixcolor-submit-answer', authBody({ selectedCardIds: [...state.mp.selectedIds] }));
    state.mp.answered = true;
    state.mp.answeredCount = data.answeredCount || state.mp.answeredCount;
    state.mp.playerCount = data.playerCount || state.mp.playerCount;
    state.mp.phase = 'waiting';
    showScreen('waitingScreen');
    renderWaitingProgress();
    if (data.allAnswered) await tryAdvanceRound();
  } catch (e) {
    if (e.code === 'ROUND_DEADLINE_PASSED') {
      state.mp.phase = 'waiting';
      showScreen('waitingScreen');
      renderWaitingProgress();
      await tryAdvanceRound();
    } else { showError(e.message); log('submit-answer', e); btn.disabled = false; }
  }
}
function renderWaitingProgress() {
  const el = document.getElementById('waitingProgress');
  el.textContent = `回答済み ${state.mp.answeredCount} / ${state.mp.playerCount || state.players.length}`;
}
async function tryAdvanceRound() {
  if (state.mp.advanceBusy) return;
  state.mp.advanceBusy = true;
  try {
    // Host usually wins the race. If the host is gone, another client safely takes over.
    // Staggering calls greatly reduces simultaneous state-transition requests.
    await sleep(progressionDelayMs());
    await fetchLobbyState();
    if (!['countdown', 'playing'].includes(state.room.status)) return;
    await callFunction('mixcolor-advance-round', authBody());
    await fetchLobbyState();
    if (state.room.status === 'round_result') await ensureRoundResult();
  } catch (e) {
    if (e.code !== 'ROUND_STILL_ACTIVE' && e.code !== 'ROUND_NOT_ACTIVE') log('advance-round', e);
  } finally { state.mp.advanceBusy = false; }
}

/* ---------- Round result ---------- */
function resetRoundResultUi(roundNo) {
  const listEl = document.getElementById('revealList');
  const labelEl = document.getElementById('revealStepLabel');
  const targetEl = document.getElementById('revealTargetSwatch');
  const progressEl = document.getElementById('roundReadyProgress');
  const btn = document.getElementById('roundReadyBtn');

  // 前ラウンドのDOMを表示前に必ず消す。
  listEl.innerHTML = '';
  labelEl.textContent = roundNo ? `ROUND ${roundNo} RESULT` : 'ROUND RESULT';
  targetEl.style.background = 'transparent';
  progressEl.textContent = '結果を読み込み中…';
  btn.disabled = true;
  btn.textContent = 'OK！';
}

async function ensureRoundResult() {
  const roundNo = Number(state.room.currentRound || state.mp.roundNumber || 0);
  const enteringNewResult = state.mp.phase !== 'reveal' || state.mp.revealRound !== roundNo;

  if (enteringNewResult) {
    clearRoundTimers();
    state.mp.phase = 'reveal';
    state.mp.revealRound = roundNo;
    state.mp.resultRenderedRound = 0;
    resetRoundResultUi(roundNo);
    showScreen('roundRevealScreen');
  }

  let data;

try {
  data = await callFunction(
    'mixcolor-round-result',
    authBody()
  );
} catch (e) {
  if (
    e.code === 'NOT_ROUND_RESULT' ||
    e.code === 'ROUND_RESULT_NOT_READY'
  ) {
    await fetchLobbyState();

    if (
      state.room.status === 'final_result'
    ) {
      await ensureFinalResult();
      return;
    }

    if (
      state.room.status === 'countdown' ||
      state.room.status === 'playing'
    ) {
      await syncActiveGame();
      return;
    }

    return;
  }

  log('round-result', e);
  return;
}

  // ランキング本体は各ラウンド1回だけ描画。以後のポーリングではOK人数だけ更新する。
  if (state.mp.resultRenderedRound !== roundNo) {
    renderRoundResult(data);
    state.mp.resultRenderedRound = roundNo;
  }
  renderRoundReady(data);

  // 全員OKになったら、どの参加者からでも安全に次へ進行を試みる。
  if (data.allReady) {
  await sleep(progressionDelayMs());

  goNextRound().catch(e => {
    log('goNextRound from result', e);
  });
}
}

function renderRoundResult(data) {
  const listEl = document.getElementById('revealList');
  const labelEl = document.getElementById('revealStepLabel');
  document.getElementById('revealTargetSwatch').style.background = toHex(data.round.target);
  listEl.innerHTML = '';
  labelEl.textContent = `ROUND ${data.round.roundNumber} RESULT`;
  (data.players || []).forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'reveal-row' + (p.playerId === state.playerId ? ' me' : '');
    const swatch = p.mixedColor ? toHex(p.mixedColor) : '#D2D2D2';
    row.innerHTML = `
      <div class="reveal-rank">${p.rank}.</div>
      <div class="reveal-swatch" style="background:${swatch}"></div>
      <div class="reveal-name">${p.playerName}${p.playerId === state.playerId ? ' (YOU)' : ''}</div>
      <div class="reveal-pct">${Number(p.matchPercent).toFixed(1)}%</div>
      <div class="reveal-score">+${p.roundScore}</div>
      <div class="reveal-total">${p.totalScore}</div>`;
    listEl.appendChild(row);
    const id = setTimeout(() => row.classList.add('show'), 100 * i);
    state.mp.revealTimeoutIds.push(id);
  });
}

function renderRoundReady(data) {
  const btn = document.getElementById('roundReadyBtn');
  const progressEl = document.getElementById('roundReadyProgress');
  const readyCount = Number(data.readyCount || 0);
  const playerCount = Number(data.playerCount || 0);

  progressEl.textContent = `OK ${readyCount} / ${playerCount}`;

  if (data.allReady) {
    btn.disabled = true;
    btn.textContent = '全員OK！';
  } else if (data.myReady) {
    btn.disabled = true;
    btn.textContent = 'OK済み ✓';
  } else {
    btn.disabled = state.mp.readyBusy;
    btn.textContent = state.mp.readyBusy ? '送信中…' : 'OK！';
  }
}

document.getElementById('roundReadyBtn').onclick = async () => {
  if (state.mp.readyBusy || state.mp.phase !== 'reveal') return;
  state.mp.readyBusy = true;
  const btn = document.getElementById('roundReadyBtn');
  btn.disabled = true;
  btn.textContent = '送信中…';
  try {
    const data = await callFunction('mixcolor-ready-next', authBody());
    // 押した本人は即座に表示を更新する。
    renderRoundReady({
      readyCount: data.readyCount,
      playerCount: data.playerCount,
      allReady: data.allReady,
      myReady: true,
    });
    if (data.allReady) {
  await sleep(progressionDelayMs());

  goNextRound().catch(e => {
    log('goNextRound from ready', e);
  });
}
  } catch (e) {
    log('ready-next', e);
    showError(e.message);
    btn.disabled = false;
    btn.textContent = 'OK！';
  } finally {
    state.mp.readyBusy = false;
  }
};

async function goNextRound() {
  if (state.mp.nextBusy) return;

  state.mp.nextBusy = true;

  try {
    await fetchLobbyState();

    /*
      別クライアントがすでにFINAL RESULTへ
      進めていた場合にも対応する。
    */
    if (state.room.status === 'final_result') {
      state.mp.finalShown = false;
      await ensureFinalResult();
      return;
    }

    if (state.room.status !== 'round_result') {
      return;
    }

    try {
      await callFunction(
        'mixcolor-next-round',
        authBody(),
      );
    } catch (e) {
      /*
        同時実行などで先に別端末が
        状態を進めた場合はエラー扱いにせず
        最新状態を確認する。
      */
      if (
        e.code !== 'ROUND_RESULT_NOT_ACTIVE' &&
        e.code !== 'NOT_ROUND_RESULT'
      ) {
        throw e;
      }
    }

    /*
      サーバー状態の反映を少し待ちながら、
      最大数回確認する。
    */
    for (let i = 0; i < 6; i++) {
      await fetchLobbyState();

      if (state.room.status === 'final_result') {
        state.mp.finalShown = false;
        await ensureFinalResult();
        return;
      }

      if (
        state.room.status === 'countdown' ||
        state.room.status === 'playing'
      ) {
        await syncActiveGame();
        return;
      }

      await sleep(300);
    }

  } catch (e) {
    log('next-round', e);
  } finally {
    state.mp.nextBusy = false;
  }
}

/* ---------- Final result ---------- */
async function ensureFinalResult() {
  if (state.mp.finalShown) return;
  clearRoundTimers();
  state.mp.phase = 'final';
  let data;
  try { data = await callFunction('mixcolor-final-result', authBody()); }
  catch (e) { log('final-result', e); return; }
  state.mp.finalShown = true;
  renderFinal(data);
  showScreen('finalResultScreen');
}
function renderFinal(data) {
  const players = data.players || [];
  const topRank = players.filter(p => p.rank === 1);
  document.getElementById('finalWinnerTag').textContent = topRank.length > 1 ? 'WINNERS' : 'WINNER';
  document.getElementById('finalWinnerName').textContent = topRank.map(p => p.playerName).join(' / ') || '---';
  const rankingEl = document.getElementById('finalRanking');
  rankingEl.innerHTML = '';
  players.forEach(p => {
    const row = document.createElement('div');
    const isMe = p.playerId === state.playerId;
    row.className = 'final-row' + (p.rank === 1 ? ' top' : '') + (isMe ? ' me' : '');
    row.innerHTML = `
      <div class="final-rank">${p.rank}</div>
      <div class="final-name">${p.playerName}${isMe ? ' (YOU)' : ''}</div>
      <div class="final-score">${p.totalScore} / 5000</div>`;
    rankingEl.appendChild(row);
  });
  const host = isHost();
  const rematchBtn = document.getElementById('rematchBtn');
  const rematchWaitingNote = document.getElementById('rematchWaitingNote');
  const newRoomBtn = document.getElementById('newRoomAfterFinalBtn');

  rematchBtn.style.display = host ? '' : 'none';
  rematchWaitingNote.style.display = host ? 'none' : '';
  newRoomBtn.style.display = host ? 'none' : '';

  if (!host) {
    rematchWaitingNote.textContent =
      'ホストの再戦を待っています。待たずに新しいルームを作ることもできます';
  }
}

/* ---------- Leave / rematch ---------- */
function clearLocalRoomAndReturn() {
  clearRoundTimers(); stopPolling();
  localStorage.removeItem(LS_ROOM_ID);
  localStorage.removeItem(LS_PLAYER_ID);
  localStorage.removeItem(LS_RECONNECT_TOKEN);
  state.roomId = null; state.playerId = null; state.room = null; state.players = [];
  state.mp.phase = 'idle';
  state.mp.roundNumber = 0;
  state.mp.question = null;
  state.mp.selectedIds = [];
  state.mp.finalShown = false;
  state.mp.revealRound = 0;
    state.mp.resultRenderedRound = 0;
    state.mp.readyBusy = false;
  showScreen('entryScreen');
}

async function doLeaveRoom() {
  if (!state.roomId || !state.playerId) {
    clearLocalRoomAndReturn();
    return;
  }
  try {
    showError('');
    await callFunction('mixcolor-leave-room', authBody());
    clearLocalRoomAndReturn();
  } catch (e) {
    showError(e.message);
    log('leave-room', e);
  }
}

document.querySelectorAll('.js-game-leave-btn').forEach(btn => {
  btn.onclick = async () => {
    if (!confirm('ゲームの途中ですが退出しますか？')) return;
    btn.disabled = true;
    try {
      await doLeaveRoom();
    } finally {
      btn.disabled = false;
    }
  };
});

document.getElementById('leaveRoomBtn').onclick = async () => {
  if (!confirm('ルームから退出しますか？')) return;
  await doLeaveRoom();
};

document.getElementById('leaveAfterFinalBtn').onclick = async () => {
  if (!confirm('ルームから退出しますか？')) return;
  await doLeaveRoom();
};

document.getElementById('newRoomAfterFinalBtn').onclick = async () => {
  const btn = document.getElementById('newRoomAfterFinalBtn');
  if (!confirm('現在のルームを退出して、新しいルームを作りますか？')) return;

  btn.disabled = true;
  try {
    const lastName = localStorage.getItem(LS_LAST_NAME) || '';
    const difficulty = state.room?.difficulty || 'NORMAL';

    await doLeaveRoom();

    document.getElementById('createNameInput').value = lastName;
    document.getElementById('createDifficultySelect').value = difficulty;
    showError('');
    showScreen('createScreen');
  } finally {
    btn.disabled = false;
  }
};

document.getElementById('rematchBtn').onclick = async () => {
  if (!isHost()) return;
  const btn = document.getElementById('rematchBtn');
  btn.disabled = true;
  try {
    showError('');
    await callFunction('mixcolor-rematch', authBody());
    clearRoundTimers();
    state.mp.phase = 'idle';
    state.mp.roundNumber = 0;
    state.mp.question = null;
    state.mp.selectedIds = [];
    state.mp.finalShown = false;
    state.mp.revealRound = 0;
    state.mp.resultRenderedRound = 0;
    state.mp.readyBusy = false;
    await syncNow();
  } catch (e) {
    showError(e.message);
    log('rematch', e);
  } finally {
    btn.disabled = false;
  }
};

/* ---------- Reconnect ---------- */
(async function init() {
  const roomId = localStorage.getItem(LS_ROOM_ID);
  const playerId = localStorage.getItem(LS_PLAYER_ID);
  const token = localStorage.getItem(LS_RECONNECT_TOKEN);
  if (roomId && playerId && token) {
    try {
      await enterRoom(roomId, playerId);
      return;
    } catch (e) {
      log('reconnect failed', e);
      localStorage.removeItem(LS_ROOM_ID);
      localStorage.removeItem(LS_PLAYER_ID);
      localStorage.removeItem(LS_RECONNECT_TOKEN);
    }
  }
  showScreen('entryScreen');
})();
</script>
