<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MIX COLOR! - STANDARD</title>
<style>
  :root{
    --bg: #F7F7F7;
    --card-bg: #FFFFFF;
    --ink: #1E1E2E;
    --sub-ink: #8A8A9A;
    --magenta: #FF2E9A;
    --cyan: #00C2FF;
    --purple: #7C3AED;
    --yellow: #FFD400;
    --lime: #A6FF00;
    --radius-lg: 28px;
    --radius-md: 18px;
    --shadow: 0 6px 18px rgba(30,30,46,0.10);
    --shadow-strong: 0 10px 28px rgba(124,58,237,0.25);
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; height:100vh; height:100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    overflow: hidden;
  }
  #app{
    max-width: 480px;
    margin: 0 auto;
    height: 100vh; height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 18px 18px 34px;
    overflow: hidden;
    position: relative;
    z-index: 1;
  }
  /* 画面いっぱいに敷く背景レイヤー（ロゴ等はこの上に重ねて表示する） */
  .fullscreen-bg{
    position: fixed; inset: 0; width: 100%; height: 100vh; height: 100dvh;
    background-size: cover; background-position: center; background-repeat: no-repeat;
    z-index: 0; opacity: 0; transition: opacity 0.25s ease; pointer-events: none;
  }
  .fullscreen-bg.active{ opacity: 1; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 10px; min-height: 36px;
  }
  .back-btn{
    width:36px; height:36px; border-radius:50%;
    background: var(--card-bg); border:none; box-shadow: var(--shadow);
    font-size: 18px; font-weight:900; color: var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .back-btn.hidden{ visibility:hidden; }
  .screen-title{ font-weight:900; font-size:15px; letter-spacing:1px; }
  .logo{ text-align:center; margin: 4px 0 14px; }
  .logo img{ height: 34px; display:inline-block; }
  .panel{ background: var(--card-bg); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 16px; }

  /* ---------- 難易度選択画面 ---------- */
  .diff-list{ display:flex; flex-direction:column; gap:12px; }
  .standard-bg-screen{
    padding: 4px 2px; box-sizing: border-box;
  }
  .diff-card{
    display:flex; align-items:center; gap:14px;
    background: var(--card-bg); border-radius: var(--radius-md); box-shadow: var(--shadow);
    padding: 14px 16px; cursor:pointer; border: none; width:100%; text-align:left;
    position: relative;
  }
  .diff-card.locked{ opacity: 0.55; cursor: default; }
  .diff-badge{
    width:52px; height:52px; border-radius:16px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:13px; color:white;
  }
  .diff-badge.lv1{ background: linear-gradient(135deg, #7CE0FF, #00C2FF); }
  .diff-badge.lv2{ background: linear-gradient(135deg, #A6FF00, #4CD964); color:#1E1E2E; }
  .diff-badge.lv3{ background: linear-gradient(135deg, #FFD400, #FF9500); color:#1E1E2E; }
  .diff-badge.lv4{ background: linear-gradient(135deg, #FF6FA5, #FF2E9A); }
  .diff-badge.lv5{ background: linear-gradient(135deg, #B47CFF, #7C3AED); }
  .diff-info{ flex:1; }
  .diff-name{ font-weight:900; font-size:16px; }
  .diff-sub{ font-size:12px; color:var(--sub-ink); font-weight:700; margin-top:2px; }
  .diff-best{ font-size:11px; color: var(--purple); font-weight:800; margin-top:4px; }
  .lock-icon{ font-size:20px; color: var(--sub-ink); }

  /* ---------- プレイ画面 ---------- */
  .stage-progress{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 12px;
  }
  #stageLabel{
    font-weight:900; font-size:12px; color: white; letter-spacing:1px;
    background: linear-gradient(90deg, var(--purple), var(--magenta));
    padding: 6px 16px; border-radius: 999px; box-shadow: var(--shadow-strong);
  }
  .stage-dots{ display:flex; gap:4px; }
  .stage-dot{ width:8px; height:8px; border-radius:50%; background:#E4E4EC; }
  .stage-dot.done{ background: var(--lime); }
  .stage-dot.current{ background: var(--purple); transform: scale(1.3); }

  .target-wrap{ text-align:center; margin-bottom:16px; }
  .label-eyebrow{
    font-size: 12px; font-weight: 900; color: var(--purple); letter-spacing: 3px; margin-bottom: 10px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .label-eyebrow::before, .label-eyebrow::after{
    content:''; display:inline-block; width:18px; height:2px; border-radius:2px;
    background: linear-gradient(90deg, var(--magenta), var(--purple), var(--cyan));
  }
  .target-swatch{ width: 100%; height: 140px; border-radius: var(--radius-lg); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04); }
  .prompt-text{
    text-align:center; font-weight: 900; font-size: 15px; margin: 14px 0 12px;
    background: linear-gradient(90deg, #F1E9FF, #E4F7FF); color: var(--ink); display:block; padding: 9px 20px;
    border-radius: 999px; box-sizing: border-box; box-shadow: 0 2px 8px rgba(124,58,237,0.10);
  }
  .prompt-text .accent{ color: var(--purple); font-size: 18px; }
  .hand-grid{ display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; padding: 4px; }
  .card-slot{ position: relative; flex: 0 0 calc(25% - 7.5px); max-width: calc(25% - 7.5px); aspect-ratio: 1/1; min-width: 0; min-height: 0; }
  .color-card{
    width:100%; height:100%; border-radius: var(--radius-md); border: none; cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease; box-shadow: 0 3px 8px rgba(0,0,0,0.08); position: relative;
    box-sizing: border-box;
  }
  .color-card.selected{
    transform: translateY(-4px); box-shadow: 0 10px 20px rgba(124,58,237,0.35);
    outline: 3px solid var(--purple); outline-offset: -3px;
  }
  .check-badge{
    position:absolute; top:2px; right:2px; width:20px; height:20px; border-radius:50%;
    background: var(--lime); display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:900; color:#1E1E2E; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .mix-btn{
    width:100%; padding: 16px; border: none; border-radius: 999px; font-weight: 900; font-size: 18px;
    color: white; background: var(--sub-ink); opacity: 0.45; cursor: not-allowed;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .mix-btn.enabled{
    background: linear-gradient(90deg, var(--magenta), var(--purple) 55%, var(--cyan));
    opacity: 1; cursor: pointer; box-shadow: var(--shadow-strong);
  }
  .mix-btn.enabled:active{ transform: scale(0.97); }

  /* ---------- ステージ結果 ---------- */
  .result-wrap{ text-align:center; }
  .result-colors{ display:flex; gap:10px; margin: 10px 0 14px; }
  .result-colors > div{ flex:1; }
  .result-swatch{ width:100%; height:90px; border-radius: var(--radius-md); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
  .result-swatch-label{ font-size:11px; font-weight:800; color:var(--sub-ink); margin-top:6px; }
  .match-pct{ font-size: 42px; font-weight: 900; margin: 4px 0 2px; }
  .match-label{ display:inline-block; padding: 5px 18px; border-radius: 999px; font-weight: 900; font-size: 14px; color: white; margin-bottom: 8px; }
  .match-label.MISS{ background: #B0B0BC; }
  .match-label.CLEAR{ background: var(--cyan); }
  .match-label.GOOD{ background: var(--lime); color:#1E1E2E; }
  .match-label.GREAT{ background: var(--yellow); color:#1E1E2E; }
  .match-label.PERFECT{ background: linear-gradient(90deg, var(--magenta), var(--purple)); }
  .score-text{ font-weight:800; color: var(--sub-ink); margin-bottom:12px; }
  .score-text b{ color: var(--ink); font-size:18px; }
  .correct-note{ font-size: 12px; color: var(--sub-ink); font-weight: 700; margin: 6px 0 4px; }
  .next-btn{
    width:100%; padding:15px; border:none; border-radius:999px; font-weight:900; font-size:16px; color:white; cursor:pointer;
    background: linear-gradient(90deg, var(--purple), var(--cyan)); box-shadow: var(--shadow-strong); margin-top: 6px;
  }

  /* ---------- ラン結果 ---------- */
  .run-result{ text-align:center; }
  .run-total-label{ font-size:12px; font-weight:800; color:var(--sub-ink); letter-spacing:2px; margin-bottom:4px; }
  .run-total-score{ font-size: 44px; font-weight:900; }
  .run-total-max{ font-size:16px; font-weight:800; color:var(--sub-ink); }
  .new-record{
    display:inline-block; margin: 10px 0; padding: 6px 16px; border-radius:999px;
    background: linear-gradient(90deg, var(--yellow), #FF9500); color:#1E1E2E; font-weight:900; font-size:13px;
  }
  .stat-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:8px; margin: 16px 0; }
  .stat-item{ background:#F7F7F7; border-radius:14px; padding:10px 6px; }
  .stat-num{ font-weight:900; font-size:18px; }
  .stat-label{ font-size:10px; color:var(--sub-ink); font-weight:800; margin-top:2px; }
  .best-note{ font-size:12px; color:var(--sub-ink); font-weight:700; margin-bottom:16px; }
  .run-btn-row{ display:flex; gap:10px; }
  .run-btn-row .next-btn{ margin-top:0; }
  .secondary-btn{
    flex:1; padding:15px; border:2px solid #E4E4EC; border-radius:999px; font-weight:900; font-size:14px;
    color: var(--ink); background: white; cursor:pointer;
  }

  /* ---------- 音・振動設定 ---------- */
  .audio-settings-fab{
    position:fixed; right:14px; bottom:calc(14px + env(safe-area-inset-bottom, 0px));
    width:46px; height:46px; border:none; border-radius:50%;
    background:#FFFFFF; color:var(--ink); box-shadow:0 6px 18px rgba(30,30,46,0.18);
    font-size:20px; cursor:pointer; z-index:1300;
    display:flex; align-items:center; justify-content:center;
  }
  .audio-settings-overlay{
    position:fixed; inset:0; z-index:1400; background:rgba(20,20,35,0.38);
    display:none; align-items:center; justify-content:center;
    padding:20px calc(18px + env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px));
  }
  .audio-settings-overlay.open{ display:flex; }
  .audio-settings-card{
    width:min(100%,420px); background:#FFFFFF; border-radius:26px;
    box-shadow:0 18px 50px rgba(20,20,35,0.22); padding:18px;
  }
  .audio-settings-head{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;
  }
  .audio-settings-title{font-weight:900;font-size:18px;}
  .audio-settings-close{
    width:36px;height:36px;border:none;border-radius:50%;background:#F2F2F7;
    font-size:20px;font-weight:900;cursor:pointer;
  }
  .audio-setting-row{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:14px 2px; border-bottom:1px solid #F0F0F5;
  }
  .audio-setting-row.stack{display:block;}
  .audio-setting-label{font-size:14px;font-weight:900;}
  .audio-setting-sub{font-size:11px;color:var(--sub-ink);font-weight:700;margin-top:3px;}
  .audio-toggle{
    width:52px;height:30px;border:none;border-radius:999px;background:#E4E4EC;
    position:relative;cursor:pointer;flex:0 0 auto;transition:background .2s ease;
  }
  .audio-toggle::after{
    content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;
    background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s ease;
  }
  .audio-toggle.on{background:linear-gradient(90deg,var(--magenta),var(--purple));}
  .audio-toggle.on::after{transform:translateX(22px);}
  .audio-range-wrap{display:flex;align-items:center;gap:10px;margin-top:10px;}
  .audio-range{width:100%;accent-color:var(--purple);}
  .audio-range-value{width:42px;text-align:right;font-size:12px;font-weight:900;color:var(--purple);}
  .audio-settings-note{font-size:10px;color:var(--sub-ink);font-weight:700;line-height:1.5;margin-top:12px;}


  /* ---------- Native AdMob banner safe-area ---------- */
  :root{ --mixcolor-ad-height:60px; }
  body.mixcolor-ad-visible .audio-settings-fab{
    bottom:calc(var(--mixcolor-ad-height) + 14px + env(safe-area-inset-bottom, 0px));
  }
  .ad-privacy-btn{
    width:100%; padding:13px 14px; margin-top:14px;
    border:2px solid #ECECF2; border-radius:14px;
    background:#FFFFFF; color:var(--ink);
    font-weight:800; font-size:13px; cursor:pointer;
  }

  body.mixcolor-ad-visible #app{
    padding-bottom:calc(34px + var(--mixcolor-ad-height) + env(safe-area-inset-bottom, 0px));
  }

</style>
</head>
<body>
<div id="standardBgLayer" class="fullscreen-bg"></div>
<div id="app">
  <div class="topbar">
    <button class="back-btn hidden" id="backBtn">‹</button>
    <div class="screen-title" id="screenTitle"></div>
    <div style="width:36px;"></div>
  </div>
  <div class="logo" id="logoHeader"><img src="mix_color_logo.png" alt="MIX COLOR!"></div>

  <!-- 難易度選択 -->
  <div id="diffSelectScreen" class="standard-bg-screen">
    <div style="text-align:right;margin-bottom:8px;">
      <button id="homeBtnSingle" style="border:none;background:white;box-shadow:var(--shadow);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;">🏠</button>
    </div>
    <div class="diff-list" id="diffList"></div>
  </div>

  <!-- プレイ画面 -->
  <div id="playScreen" style="display:none;">
    <div class="stage-progress">
      <span id="stageLabel">STAGE 1/10</span>
      <div class="stage-dots" id="stageDots"></div>
    </div>
    <div class="panel">
      <div class="target-wrap">
        <div class="label-eyebrow">TARGET</div>
        <div class="target-swatch" id="targetSwatch"></div>
      </div>
      <div class="prompt-text" id="promptText"></div>
      <div class="hand-grid" id="handGrid"></div>
      <button class="mix-btn" id="mixBtn">MIX!</button>
    </div>
  </div>

  <!-- ステージ結果 -->
  <div id="stageResultScreen" style="display:none;">
    <div class="panel result-wrap">
      <div class="label-eyebrow">STAGE RESULT</div>
      <div class="result-colors">
        <div><div class="result-swatch" id="resTarget"></div><div class="result-swatch-label">お題の色</div></div>
        <div><div class="result-swatch" id="resMixed"></div><div class="result-swatch-label">あなたの色</div></div>
      </div>
      <div class="match-pct" id="matchPct">--%</div>
      <div class="match-label" id="matchLabel">-</div>
      <div class="score-text">SCORE <b id="scoreText">0</b> / 1000</div>
      <div class="correct-note" id="correctNote"></div>
      <button class="next-btn" id="nextStageBtn">つぎのステージへ</button>
    </div>
  </div>

  <!-- ラン結果 -->
  <div id="runResultScreen" style="display:none;">
    <div class="panel run-result">
      <div class="run-total-label">TOTAL SCORE</div>
      <div><span class="run-total-score" id="runTotalScore">0</span><span class="run-total-max"> / 10000</span></div>
      <div id="newRecordBadge" style="display:none;" class="new-record">NEW RECORD!</div>
      <div class="stat-grid" id="statGrid"></div>
      <div class="best-note" id="bestNote"></div>
      <div class="run-btn-row">
        <button class="secondary-btn" id="toMenuBtn">難易度選択へ</button>
        <button class="next-btn" id="retryBtn" style="flex:1;">もう一度</button>
      </div>
    </div>
  </div>
</div>


  <button class="audio-settings-fab" id="audioSettingsBtn" aria-label="音・振動設定">⚙️</button>
  <div class="audio-settings-overlay" id="audioSettingsOverlay" aria-hidden="true">
    <div class="audio-settings-card" role="dialog" aria-modal="true" aria-labelledby="audioSettingsTitle">
      <div class="audio-settings-head">
        <div class="audio-settings-title" id="audioSettingsTitle">音・振動設定</div>
        <button class="audio-settings-close" id="audioSettingsClose" aria-label="閉じる">×</button>
      </div>

      <div class="audio-setting-row">
        <div>
          <div class="audio-setting-label">BGM</div>
          <div class="audio-setting-sub">ゲーム中の音楽</div>
        </div>
        <button class="audio-toggle" id="audioBgmToggle" aria-label="BGM ON/OFF"></button>
      </div>
      <div class="audio-setting-row stack">
        <div class="audio-setting-label">BGM音量</div>
        <div class="audio-range-wrap">
          <input class="audio-range" id="audioBgmVolume" type="range" min="0" max="100" step="5">
          <span class="audio-range-value" id="audioBgmVolumeValue">25%</span>
        </div>
      </div>

      <div class="audio-setting-row">
        <div>
          <div class="audio-setting-label">効果音</div>
          <div class="audio-setting-sub">ボタン・MIX・結果音</div>
        </div>
        <button class="audio-toggle" id="audioSeToggle" aria-label="効果音 ON/OFF"></button>
      </div>
      <div class="audio-setting-row stack">
        <div class="audio-setting-label">効果音量</div>
        <div class="audio-range-wrap">
          <input class="audio-range" id="audioSeVolume" type="range" min="0" max="100" step="5">
          <span class="audio-range-value" id="audioSeVolumeValue">65%</span>
        </div>
      </div>

      <div class="audio-setting-row">
        <div>
          <div class="audio-setting-label">振動</div>
          <div class="audio-setting-sub">iPhoneのHaptics</div>
        </div>
        <button class="audio-toggle" id="audioHapticsToggle" aria-label="振動 ON/OFF"></button>
      </div>
      <div class="audio-settings-note">設定はこの端末に保存されます。振動の強さはiOS側の仕様に合わせ、アプリではON/OFFのみです。</div>
      <button class="ad-privacy-btn" id="adPrivacyBtn" style="display:none;">広告のプライバシー設定</button>
    </div>
  </div>


<script src="mixcolor_ads.js"></script>
<script>

/* ---------- AdMob / UMP ---------- */
window.addEventListener('DOMContentLoaded', async () => {
  MixColorAds.bindPrivacyButton('adPrivacyBtn');
  await MixColorAds.init();
  await MixColorAds.setBannerVisible(true); // 初期: 難易度選択
});

const STANDARD_BG_FILE = 'mixcolor_single_standard_background.jpg';


/* =========================================================
   AUDIO / HAPTICS
   ホーム・マルチプレイと共通の localStorage 設定を使用
   ========================================================= */
const LS_BGM = 'mixcolor_settings_bgm';
const LS_SOUND = 'mixcolor_settings_sound';
const LS_HAPTICS = 'mixcolor_settings_haptics';
const LS_BGM_VOLUME = 'mixcolor_settings_bgm_volume';
const LS_SE_VOLUME = 'mixcolor_settings_se_volume';

const SettingsFlags = {
  bgmOn: localStorage.getItem(LS_BGM) !== 'off',
  soundOn: localStorage.getItem(LS_SOUND) !== 'off',
  hapticsOn: localStorage.getItem(LS_HAPTICS) !== 'off',
  bgmVolume: Math.max(0, Math.min(1, Number(localStorage.getItem(LS_BGM_VOLUME) ?? 0.25))),
  seVolume: Math.max(0, Math.min(1, Number(localStorage.getItem(LS_SE_VOLUME) ?? 0.65))),
};

function setBgmEnabled(on) {
  SettingsFlags.bgmOn = !!on;
  localStorage.setItem(LS_BGM, on ? 'on' : 'off');
  if (!on) {
    bgmHome.pause();
    bgmGame.pause();
  } else {
    switchBgm(desiredBgm || 'home');
  }
}
function setSoundEnabled(on) {
  SettingsFlags.soundOn = !!on;
  localStorage.setItem(LS_SOUND, on ? 'on' : 'off');
}
function setHapticsEnabled(on) {
  SettingsFlags.hapticsOn = !!on;
  localStorage.setItem(LS_HAPTICS, on ? 'on' : 'off');
}
function setBgmVolume(v) {
  BGM_VOLUME = Math.max(0, Math.min(1, Number(v)));
  SettingsFlags.bgmVolume = BGM_VOLUME;
  localStorage.setItem(LS_BGM_VOLUME, String(BGM_VOLUME));
  bgmHome.volume = BGM_VOLUME;
  bgmGame.volume = BGM_VOLUME;
}
function setSeVolume(v) {
  SE_VOLUME = Math.max(0, Math.min(1, Number(v)));
  SettingsFlags.seVolume = SE_VOLUME;
  localStorage.setItem(LS_SE_VOLUME, String(SE_VOLUME));
}

let BGM_VOLUME = SettingsFlags.bgmVolume;
let SE_VOLUME = SettingsFlags.seVolume;

const bgmHome = new Audio('bgm_home.mp3');
const bgmGame = new Audio('bgm_game.mp3');
[bgmHome, bgmGame].forEach(a => {
  a.loop = true;
  a.preload = 'auto';
  a.volume = BGM_VOLUME;
});

const seFiles = {
  tap: 'se_tap.mp3',
  select: 'se_select.mp3',
  mix: 'se_mix.mp3',
  result: 'se_result.mp3',
  countdown: 'se_countdown.mp3',
  start: 'se_start.mp3',
  perfect: 'se_perfect.mp3',
  final: 'se_final.mp3',
  wrong: 'se_wrong.wav',
};

const seAudio = {};
Object.entries(seFiles).forEach(([key, src]) => {
  const a = new Audio(src);
  a.preload = 'auto';
  a.volume = SE_VOLUME;
  seAudio[key] = a;
});

let audioUnlocked = false;
let desiredBgm = null;

function safePlay(audio) {
  if (!audio) return;
  try {
    audio.currentTime = 0;

/* ---------- App lifecycle: background / screen lock stops BGM ---------- */
let mixcolorNativeAppPlugin = null;

function pauseBgmForInactiveApp() {
  bgmHome.pause(); bgmGame.pause();
}

function resumeBgmForActiveApp() {
  switchBgm(desiredBgm || 'home');
}

function installAppLifecycleHandlers() {
  const cap = window.Capacitor;
  mixcolorNativeAppPlugin =
    cap?.Plugins?.App ||
    (typeof cap?.registerPlugin === 'function' ? cap.registerPlugin('App') : null);

  if (mixcolorNativeAppPlugin && typeof mixcolorNativeAppPlugin.addListener === 'function') {
    try {
      mixcolorNativeAppPlugin.addListener('appStateChange', (state) => {
        if (state && state.isActive === false) pauseBgmForInactiveApp();
        else if (state && state.isActive === true) resumeBgmForActiveApp();
      });
      mixcolorNativeAppPlugin.addListener('pause', pauseBgmForInactiveApp);
      mixcolorNativeAppPlugin.addListener('resume', resumeBgmForActiveApp);
    } catch (e) {
      console.warn('[MIX COLOR] App lifecycle:', e);
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) pauseBgmForInactiveApp();
    else resumeBgmForActiveApp();
  });
  window.addEventListener('pagehide', pauseBgmForInactiveApp);
  window.addEventListener('blur', pauseBgmForInactiveApp);
  window.addEventListener('focus', () => {
    if (!document.hidden) resumeBgmForActiveApp();
  });
}

installAppLifecycleHandlers();

async function hapticFeedback(kind = 'light') {
  if (!(SettingsFlags.hapticsOn)) return;

  try {
    const cap = window.Capacitor;
    const Haptics =
      cap?.Plugins?.Haptics ||
      (typeof cap?.registerPlugin === 'function' ? cap.registerPlugin('Haptics') : null);

    if (Haptics) {
      if (kind === 'success' && typeof Haptics.notification === 'function') {
        await Haptics.notification({ type: 'SUCCESS' });
        return;
      }
      if (kind === 'failure' && typeof Haptics.notification === 'function') {
        await Haptics.notification({ type: 'ERROR' });
        return;
      }
      if (typeof Haptics.impact === 'function') {
        const style = kind === 'medium' ? 'MEDIUM' : kind === 'heavy' ? 'HEAVY' : 'LIGHT';
        await Haptics.impact({ style });
        return;
      }
      if (typeof Haptics.vibrate === 'function') {
        await Haptics.vibrate({ duration: kind === 'medium' ? 80 : 45 });
        return;
      }
    }
  } catch (e) {
    console.warn('[MIX COLOR] Haptics:', e);
  }

  // Browser fallback. iOS Safari normally does not support navigator.vibrate.
  if ('vibrate' in navigator) {
    const patterns = {
      light: 12,
      medium: 35,
      heavy: 55,
      success: [18, 28, 18],
      failure: [45, 30, 70],
    };
    try { navigator.vibrate(patterns[kind] ?? 12); } catch (_) {}
  }
}

function playResultFeedback(label, isCorrectChoice, extraFailure = false) {
  if (isCorrectChoice) {
    if (label === 'PERFECT') playSe('perfect');
    else playSe('result');
    hapticFeedback('success');
  } else {
    playSe('wrong');
    hapticFeedback('failure');
  }

  if (extraFailure && isCorrectChoice) {
    setTimeout(() => hapticFeedback('failure'), 220);
  }
}

/* =========================================================
   0. GENERATOR CONFIG (TUNABLE)
   ========================================================= */
const MATCH_CURVE_K = 0.03;
const DIFFICULTY_LEVELS = [
  { id: 1, label: 'EASY',   sub: 'はじめて向け',       hand: 4, select: 2, confRange: [40, 75] },
  { id: 2, label: 'NORMAL', sub: 'おすすめ',           hand: 5, select: 2, confRange: [30, 60] },
  { id: 3, label: 'HARD',   sub: 'むずかしい',         hand: 6, select: 2, confRange: [20, 45] },
  { id: 4, label: 'EXPERT', sub: 'かなりむずかしい',   hand: 6, select: 3, confRange: [12, 28] },
  { id: 5, label: 'MASTER', sub: '最高難度',           hand: 7, select: 3, confRange: [6, 18] },
];
const MAX_RANDOM_CLEAR_RATIO = { 1: 0.40, 2: 0.35, 3: 0.30, 4: 0.30, 5: 0.30 };
const GEN_MAX_ATTEMPTS = 60;
const STAGES_PER_RUN = 10;

// 7.4章: 次難易度解放に必要な「直前の難易度でのラン合計スコア」。TUNABLE。
const UNLOCK_THRESHOLDS = { 2: 7500, 3: 8000, 4: 8500, 5: 9000 };

const STORAGE_KEY_BEST = 'mixcolor_singleA_bestScores';
const STORAGE_KEY_UNLOCK = 'mixcolor_singleA_unlockedMax';

/* =========================================================
   1. COLOR MATH
   ========================================================= */
function srgbToXyz(r, g, b) {
  const toLinear = c => (c <= 0.04045) ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  const rl = toLinear(r / 255), gl = toLinear(g / 255), bl = toLinear(b / 255);
  return {
    x: rl * 0.4124564 + gl * 0.3575761 + bl * 0.1804375,
    y: rl * 0.2126729 + gl * 0.7151522 + bl * 0.0721750,
    z: rl * 0.0193339 + gl * 0.1191920 + bl * 0.9503041,
  };
}
function xyzToLab(x, y, z) {
  const Xn = 0.95047, Yn = 1.0, Zn = 1.08883;
  const f = t => (t > 0.008856) ? Math.cbrt(t) : (7.787 * t + 16 / 116);
  const fx = f(x / Xn), fy = f(y / Yn), fz = f(z / Zn);
  return { L: 116 * fy - 16, a: 500 * (fx - fy), b: 200 * (fy - fz) };
}
function srgbToLab(r, g, b) { const { x, y, z } = srgbToXyz(r, g, b); return xyzToLab(x, y, z); }

function deltaE00(lab1, lab2) {
  const { L: L1, a: a1, b: b1 } = lab1;
  const { L: L2, a: a2, b: b2 } = lab2;
  const C1 = Math.sqrt(a1 * a1 + b1 * b1);
  const C2 = Math.sqrt(a2 * a2 + b2 * b2);
  const avgC = (C1 + C2) / 2;
  const G = 0.5 * (1 - Math.sqrt(Math.pow(avgC, 7) / (Math.pow(avgC, 7) + Math.pow(25, 7))));
  const a1p = a1 * (1 + G), a2p = a2 * (1 + G);
  const C1p = Math.sqrt(a1p * a1p + b1 * b1);
  const C2p = Math.sqrt(a2p * a2p + b2 * b2);
  const avgCp = (C1p + C2p) / 2;
  let h1p = Math.atan2(b1, a1p) * 180 / Math.PI; if (h1p < 0) h1p += 360;
  let h2p = Math.atan2(b2, a2p) * 180 / Math.PI; if (h2p < 0) h2p += 360;
  let deltahp;
  if (C1p * C2p === 0) deltahp = 0;
  else if (Math.abs(h1p - h2p) <= 180) deltahp = h2p - h1p;
  else if (h2p <= h1p) deltahp = h2p - h1p + 360;
  else deltahp = h2p - h1p - 360;
  const deltaLp = L2 - L1;
  const deltaCp = C2p - C1p;
  const deltaHp = 2 * Math.sqrt(C1p * C2p) * Math.sin(deltahp * Math.PI / 360);
  const avgLp = (L1 + L2) / 2;
  let avgHp;
  if (C1p * C2p === 0) avgHp = h1p + h2p;
  else if (Math.abs(h1p - h2p) <= 180) avgHp = (h1p + h2p) / 2;
  else if ((h1p + h2p) < 360) avgHp = (h1p + h2p + 360) / 2;
  else avgHp = (h1p + h2p - 360) / 2;
  const T = 1 - 0.17 * Math.cos((avgHp - 30) * Math.PI / 180)
              + 0.24 * Math.cos(2 * avgHp * Math.PI / 180)
              + 0.32 * Math.cos((3 * avgHp + 6) * Math.PI / 180)
              - 0.20 * Math.cos((4 * avgHp - 63) * Math.PI / 180);
  const deltaTheta = 30 * Math.exp(-Math.pow((avgHp - 275) / 25, 2));
  const Rc = 2 * Math.sqrt(Math.pow(avgCp, 7) / (Math.pow(avgCp, 7) + Math.pow(25, 7)));
  const Sl = 1 + (0.015 * Math.pow(avgLp - 50, 2)) / Math.sqrt(20 + Math.pow(avgLp - 50, 2));
  const Sc = 1 + 0.045 * avgCp;
  const Sh = 1 + 0.015 * avgCp * T;
  const Rt = -Math.sin(2 * deltaTheta * Math.PI / 180) * Rc;
  return Math.sqrt(
    Math.pow(deltaLp / Sl, 2) + Math.pow(deltaCp / Sc, 2) + Math.pow(deltaHp / Sh, 2) +
    Rt * (deltaCp / Sc) * (deltaHp / Sh)
  );
}
function matchPercent(rgbA, rgbB) {
  if (rgbA.r === rgbB.r && rgbA.g === rgbB.g && rgbA.b === rgbB.b) return 100.0;
  const de = deltaE00(srgbToLab(rgbA.r, rgbA.g, rgbA.b), srgbToLab(rgbB.r, rgbB.g, rgbB.b));
  const raw = 100 / (1 + MATCH_CURVE_K * de);
  return Math.min(99.9, raw);
}
function matchLabel(match) {
  if (match === 100.0) return 'PERFECT';
  if (match >= 97.0) return 'GREAT';
  if (match >= 92.0) return 'GOOD';
  if (match >= 85.0) return 'CLEAR';
  return 'MISS';
}

/* =========================================================
   2. MIX
   ========================================================= */
function mixColors(colors) {
  const n = colors.length;
  const r = Math.round(colors.reduce((s, c) => s + c.r, 0) / n);
  const g = Math.round(colors.reduce((s, c) => s + c.g, 0) / n);
  const b = Math.round(colors.reduce((s, c) => s + c.b, 0) / n);
  return { r, g, b };
}
function toHex({ r, g, b }) {
  const h = v => v.toString(16).padStart(2, '0');
  return '#' + h(r) + h(g) + h(b);
}

/* =========================================================
   3. QUESTION GENERATOR + VALIDATOR
   ========================================================= */
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function clamp255(v) { return Math.max(0, Math.min(255, v)); }
function randomColor() { return { r: randInt(0, 255), g: randInt(0, 255), b: randInt(0, 255) }; }
function colorDist(a, b) { return Math.sqrt((a.r - b.r) ** 2 + (a.g - b.g) ** 2 + (a.b - b.b) ** 2); }

function perturbColor(c, [minD, maxD]) {
  const channels = ['r', 'g', 'b'];
  const numChannels = Math.random() < 0.6 ? 1 : 2;
  const chosen = channels.sort(() => Math.random() - 0.5).slice(0, numChannels);
  const out = { ...c };
  for (const ch of chosen) {
    const delta = randInt(minD, maxD) * (Math.random() < 0.5 ? -1 : 1);
    out[ch] = clamp255(out[ch] + delta);
  }
  if (out.r === c.r && out.g === c.g && out.b === c.b) {
    out.r = clamp255(out.r + (out.r < 128 ? maxD : -maxD));
  }
  return out;
}
function combinations(arr, k) {
  const results = [];
  function rec(start, combo) {
    if (combo.length === k) { results.push(combo.slice()); return; }
    for (let i = start; i < arr.length; i++) { combo.push(arr[i]); rec(i + 1, combo); combo.pop(); }
  }
  rec(0, []);
  return results;
}
function buildHand(correctColors, handSize, selectCount, confRange) {
  const decoyCount = handSize - selectCount;
  const decoys = [];
  for (let i = 0; i < decoyCount; i++) {
    const base = correctColors[i % correctColors.length];
    let candidate, tries = 0;
    do {
      candidate = perturbColor(base, confRange);
      tries++;
    } while (tries < 20 && [...correctColors, ...decoys].some(c => colorDist(c, candidate) < 6));
    decoys.push(candidate);
  }
  const hand = [...correctColors.map(c => ({ ...c, isCorrect: true })), ...decoys.map(c => ({ ...c, isCorrect: false }))];
  for (let i = hand.length - 1; i > 0; i--) { const j = randInt(0, i); [hand[i], hand[j]] = [hand[j], hand[i]]; }
  return hand.map((c, idx) => ({ ...c, id: 'card_' + idx }));
}
function evaluateHand(hand, target, selectCount) {
  const idxCombos = combinations(hand.map((_, i) => i), selectCount);
  return idxCombos.map(idxs => {
    const cards = idxs.map(i => hand[i]);
    const mixed = mixColors(cards);
    const match = matchPercent(mixed, target);
    return { idxs, mixed, match };
  });
}
function generateQuestion(levelId) {
  const level = DIFFICULTY_LEVELS.find(l => l.id === levelId);
  let best = null;
  for (let attempt = 0; attempt < GEN_MAX_ATTEMPTS; attempt++) {
    const correctColors = Array.from({ length: level.select }, () => randomColor());
    const target = mixColors(correctColors);
    const hand = buildHand(correctColors, level.hand, level.select, level.confRange);
    const results = evaluateHand(hand, target, level.select);
    const hasPerfect = results.some(r => r.match === 100.0);
    if (!hasPerfect) continue;
    const clearRatio = results.filter(r => r.match >= 85.0).length / results.length;
    const maxRatio = MAX_RANDOM_CLEAR_RATIO[level.id];
    const candidate = { level, correctColors, target, hand, results, clearRatio };
    if (clearRatio <= maxRatio) return { ...candidate, attempts: attempt + 1, forced: false };
    if (!best || clearRatio < best.clearRatio) best = candidate;
  }
  console.warn('[MIX COLOR] 難易度条件を満たす問題が規定試行内に生成できず、最良候補を採用しました。');
  return { ...best, attempts: GEN_MAX_ATTEMPTS, forced: true };
}

function startRun(levelId) {
  playSe('start');
  hapticFeedback('medium');
  app.levelId = levelId;
  app.stageIndex = 0;
  app.runStageResults = [];
  nextStage();
}

function nextStage() {
  app.stageQuestion = generateQuestion(app.levelId);
  app.selectedIds = [];
  showScreen('play');
  renderPlay();
}

function renderPlay() {
  const q = app.stageQuestion;
  document.getElementById('stageLabel').textContent = `STAGE ${app.stageIndex + 1}/${STAGES_PER_RUN}`;
  const dotsEl = document.getElementById('stageDots');
  dotsEl.innerHTML = '';
  for (let i = 0; i < STAGES_PER_RUN; i++) {
    const dot = document.createElement('div');
    dot.className = 'stage-dot' + (i < app.stageIndex ? ' done' : (i === app.stageIndex ? ' current' : ''));
    dotsEl.appendChild(dot);
  }

  document.getElementById('targetSwatch').style.background = toHex(q.target);
  document.getElementById('promptText').innerHTML = `<span class="accent">${q.level.select}色</span>選んでMIX！`;

  const grid = document.getElementById('handGrid');
  grid.innerHTML = '';
  q.hand.forEach(card => {
    const slot = document.createElement('div');
    slot.className = 'card-slot';
    const btn = document.createElement('button');
    const selected = app.selectedIds.includes(card.id);
    btn.className = 'color-card' + (selected ? ' selected' : '');
    btn.style.background = toHex(card);
    btn.onclick = () => onCardTap(card.id);
    slot.appendChild(btn);
    if (selected) {
      const badge = document.createElement('div');
      badge.className = 'check-badge';
      badge.textContent = app.selectedIds.indexOf(card.id) + 1;
      slot.appendChild(badge);
    }
    grid.appendChild(slot);
  });

  const mixBtn = document.getElementById('mixBtn');
  const ready = app.selectedIds.length === q.level.select;
  mixBtn.className = 'mix-btn' + (ready ? ' enabled' : '');
  mixBtn.onclick = ready ? onMix : null;
}

function onCardTap(cardId) {
  playSe('select');
  hapticFeedback('light');
  const q = app.stageQuestion;
  const idx = app.selectedIds.indexOf(cardId);
  if (idx >= 0) app.selectedIds.splice(idx, 1);
  else if (app.selectedIds.length < q.level.select) app.selectedIds.push(cardId);
  renderPlay();
}

function onMix() {
  const q = app.stageQuestion;
  const cards = app.selectedIds.map(id => q.hand.find(c => c.id === id));
  const mixed = mixColors(cards);
  const match = matchPercent(mixed, q.target);
  const label = matchLabel(match);
  const score = Math.round(match * 10);
  const isCorrectChoice =
    cards.length === q.level.select &&
    cards.every(card => card && card.isCorrect === true);

  playSe('mix');
  hapticFeedback('medium');

  app.lastStageResult = { mixed, match, label, score, isCorrectChoice };
  app.runStageResults.push({ match, label, score });

  showScreen('stageResult');
  renderStageResult();
  setTimeout(() => playResultFeedback(label, isCorrectChoice), 60);
}

function renderStageResult() {
  const q = app.stageQuestion;
  const { mixed, match, label, score, isCorrectChoice } = app.lastStageResult;
  document.getElementById('resTarget').style.background = toHex(q.target);
  document.getElementById('resMixed').style.background = toHex(mixed);
  document.getElementById('matchPct').textContent = match.toFixed(1) + '%';
  const labelEl = document.getElementById('matchLabel');
  labelEl.textContent = label;
  labelEl.className = 'match-label ' + label;
  document.getElementById('scoreText').textContent = score;
  document.getElementById('correctNote').textContent =
    isCorrectChoice ? '正解の組み合わせでした！' : '正解に使うべきだったカードは別の組み合わせでした。';

  const isLastStage = app.stageIndex === STAGES_PER_RUN - 1;
  const nextBtn = document.getElementById('nextStageBtn');
  nextBtn.textContent = isLastStage ? 'ラン結果を見る' : 'つぎのステージへ';

  let autoNextDone = false;
  const goNextStageFast = () => {
    if (autoNextDone) return;
    autoNextDone = true;
    if (isLastStage) {
      finishRun();
    } else {
      app.stageIndex += 1;
      nextStage();
    }
  };

  nextBtn.onclick = () => {
    playSe('tap');
    hapticFeedback('light');
    goNextStageFast();
  };

  // テンポ改善: 結果を短く確認したら自動で次へ。
  // ボタンを押した場合は即時で進み、二重進行はしない。
  setTimeout(() => {
    if (app.screen === 'stageResult') goNextStageFast();
  }, 1250);
}

function finishRun() {
  const total = totalScoreOfRun();
  const counts = { PERFECT: 0, GREAT: 0, GOOD: 0, CLEAR: 0, MISS: 0 };
  app.runStageResults.forEach(r => counts[r.label]++);
  const avgMatch = app.runStageResults.reduce((s, r) => s + r.match, 0) / app.runStageResults.length;

  const prevBest = app.bestScores[app.levelId] || 0;
  const isNewRecord = total > prevBest;
  if (isNewRecord) {
    app.bestScores[app.levelId] = total;
    saveBestScores(app.bestScores);
  }

  // 7.4章: 次難易度解放判定（このランのスコアが閾値を満たせば解放）
  const nextLevelId = app.levelId + 1;
  if (UNLOCK_THRESHOLDS[nextLevelId] && total >= UNLOCK_THRESHOLDS[nextLevelId] && app.unlockedMax < nextLevelId) {
    app.unlockedMax = nextLevelId;
    saveUnlockedMax(app.unlockedMax);
  }

  showScreen('runResult');
  playSe('final');
  hapticFeedback('success');
  document.getElementById('runTotalScore').textContent = total;
  document.getElementById('newRecordBadge').style.display = isNewRecord ? '' : 'none';

  const statGrid = document.getElementById('statGrid');
  statGrid.innerHTML = '';
  const statDefs = [
    ['平均一致率', avgMatch.toFixed(1) + '%'],
    ['PERFECT', counts.PERFECT],
    ['GREAT', counts.GREAT],
    ['GOOD', counts.GOOD],
    ['CLEAR', counts.CLEAR],
    ['MISS', counts.MISS],
  ];
  statDefs.forEach(([label, val]) => {
    const div = document.createElement('div');
    div.className = 'stat-item';
    div.innerHTML = `<div class="stat-num">${val}</div><div class="stat-label">${label}</div>`;
    statGrid.appendChild(div);
  });

  document.getElementById('bestNote').textContent = `自己ベスト: ${Math.max(total, prevBest)} / 10000`;
  document.getElementById('toMenuBtn').onclick = () => { playSe('tap'); hapticFeedback('light'); showScreen('diffSelect'); renderDiffSelect(); };
  document.getElementById('retryBtn').onclick = () => { playSe('tap'); hapticFeedback('light'); startRun(app.levelId); };
}

document.getElementById('backBtn').onclick = () => {
  playSe('tap');
  hapticFeedback('light');
  if (app.screen === 'play' || app.screen === 'stageResult') {
    if (confirm('シングルプレイを中断してホームに戻りますか？（このランのスコアは記録されません）')) {
      window.location.href = 'index.html';
    }
  } else {
    showScreen('diffSelect'); renderDiffSelect();
  }
};

/* =========================================================
   INIT
   ========================================================= */
document.getElementById('standardBgLayer').style.backgroundImage = `url(${STANDARD_BG_FILE})`;
document.getElementById('homeBtnSingle').onclick = () => { playSe('tap'); hapticFeedback('light'); window.location.href = 'index.html'; };
showScreen('diffSelect');
renderDiffSelect();
</script>
